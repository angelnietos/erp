<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Arquitectura de Seguridad - Plataforma CAE + DGT</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; font-family: system-ui, sans-serif; }

    .diagram-container {
      width: 100%;
      overflow-x: auto;
      padding: 12px;
      background: linear-gradient(165deg, #f8fafc 0%, #eef2f7 45%, #e8edf3 100%);
      border-radius: 14px;
      border: 1px solid rgba(100, 116, 139, 0.2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.75);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 0 20px 0;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: #334155;
    }
    .legend-dot {
      width: 15px; height: 15px; border-radius: 4px; flex-shrink: 0;
    }

    .l-infra    { background: linear-gradient(180deg,#fafaf9,#d6d3d1); border: 2px solid #57534e; }
    .l-sec-iso  { background: linear-gradient(180deg,#faf5ff,#c4b5fd); border: 2px solid #6d28d9; }
    .l-optional { background: linear-gradient(180deg,#fce7f3,#f9a8d4); border: 2px dashed #db2777; }
    .l-quality  { background: linear-gradient(180deg,#f7fee7,#d9f99d); border: 2px solid #4d7c0f; }
    .l-compliance { background: linear-gradient(180deg,#fff7ed,#fdba74); border: 2px solid #c2410c; }
    .l-data     { background: linear-gradient(180deg,#ecfdf5,#34d399); border: 2px solid #047857; }
</style>
</head>
<body>

<p style="font-size:13px;color:#1e293b;margin:0 0 12px 0;max-width:980px">
<strong>Plataforma de Gestión de CAE</strong> — +20 marcas de concesionarios · más de <strong>1000 usuarios</strong> · Integración con <strong>DGT</strong>
</p>

<div class="legend">
  <div class="legend-item"><div class="legend-dot l-infra"></div>Plataforma / Infra</div>
  <div class="legend-item"><div class="legend-dot l-sec-iso"></div><strong>ISO 27001</strong> <strong>(Obligatorio)</strong></div>
  <div class="legend-item"><div class="legend-dot l-optional"></div>Opcional / Futuro</div>
  <div class="legend-item"><div class="legend-dot l-quality"></div>Calidad · DevSecOps</div>
  <div class="legend-item"><div class="legend-dot l-compliance"></div><strong>RGPD</strong> / Compliance</div>
  <div class="legend-item"><div class="legend-dot l-data"></div>Datos · Cifrado</div>
</div>

<div class="diagram-container">
<svg width="100%" viewBox="0 -58 1680 2440" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Diagrama de arquitectura de seguridad por capas">
<title>Arquitectura de Seguridad CAE + DGT</title>
<desc>Elementos en negrita = obligatorios ISO 27001 y RGPD en nodos del diagrama.</desc>

<defs>
  <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fafaf9"/><stop offset="100%" stop-color="#e7e5e4"/></linearGradient>
  <linearGradient id="titleBar" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4c1d95"/></linearGradient>
  <linearGradient id="panelBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fafaf9"/><stop offset="100%" stop-color="#d6d3d1"/></linearGradient>
  <linearGradient id="panelMint" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff7ed"/><stop offset="100%" stop-color="#fdba74"/></linearGradient>
  <linearGradient id="panelOptional" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fdf2f8"/><stop offset="100%" stop-color="#fce7f3"/></linearGradient>
  <linearGradient id="cardInfra" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fafaf9"/><stop offset="100%" stop-color="#d6d3d1"/></linearGradient>
  <linearGradient id="cardSecurity" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#c4b5fd"/></linearGradient>
  <linearGradient id="cardOptional" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fdf2f8"/><stop offset="100%" stop-color="#f9a8d4"/></linearGradient>
  <linearGradient id="cardIso" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff7ed"/><stop offset="100%" stop-color="#fdba74"/></linearGradient>
  <linearGradient id="cardQuality" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ecfccb"/><stop offset="100%" stop-color="#bef264"/></linearGradient>
  <linearGradient id="cardData" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d1fae5"/><stop offset="100%" stop-color="#34d399"/></linearGradient>
  <filter id="panelShade" x="-3%" y="-3%" width="106%" height="108%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#292524" flood-opacity="0.12"/></filter>
  <filter id="titleShade" x="-2%" y="-30%" width="104%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.18"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57534e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="-58" width="1680" height="2440" fill="url(#pageBg)"/>

<g id="hdr" filter="url(#titleShade)">
  <rect x="24" y="-50" width="1632" height="54" rx="14" fill="url(#titleBar)"/>
  <text x="48" y="-28" font-family="system-ui,Segoe UI,sans-serif" font-size="19" fill="#ffffff"><tspan font-weight="700">Arquitectura de Seguridad CAE + DGT</tspan></text>
</g>

<text x="48" y="11" font-family="system-ui,Segoe UI,sans-serif" font-size="9.5" fill="#be185d" font-weight="500">Rosa discontinuo = Opcional. <tspan font-weight="700">Negrita = Obligatorio ISO 27001 + RGPD</tspan></text>

<!-- CAPA 1 -->
<rect x="20" y="20" width="1560" height="220" rx="18" fill="url(#panelBlue)" stroke="#57534e" stroke-width="3"/>
<text x="38" y="46" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="700">CAPA 1 — EDGE / ENTRYPOINT</tspan></text>

<!-- CAPA 5 (muy visible) -->
<rect x="20" y="1060" width="1560" height="240" rx="18" fill="#ecfdf5" stroke="#047857" stroke-width="4"/>
<text x="38" y="1086" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#065f46"><tspan font-weight="700">CAPA 5 — DATA SECURITY / RGPD</tspan></text>
<text x="125" y="1137" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#065f46"><tspan font-weight="700">SQL Server + TDE</tspan></text>
<text x="318" y="1137" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#5b21b6"><tspan font-weight="700">TDE (Obligatorio ISO/RGPD)</tspan></text>
<text x="480" y="1011" font-family="system-ui,Segoe UI,sans-serif" font-size="9.5" fill="#9a3412"><tspan font-weight="700">MASKING API ↔ DDM (Obligatorio RGPD)</tspan></text>

</svg>
</div>
</body>
</html>
