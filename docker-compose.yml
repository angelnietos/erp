version: '3.9'

services:
  # BD del ERP (Prisma): tenants, usuarios, datos de negocio. Puerto 5435.
  postgres:
    image: postgres:16-alpine
    container_name: josanz_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: josanz_erp
    ports:
      - '5435:5432'
    volumes:
      - josanz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: josanz_erp_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  # BD interna de Keycloak (realms, usuarios KC). Sin puerto público.
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - keycloak-network

  # IdP OIDC. Realms en docker/keycloak/realms/. Solo josanz/babooni usan KC en login ERP.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_DB_DATABASE: keycloak
      KC_HOSTNAME: localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge
      KEYCLOAK_FRONTEND_URL: http://localhost:8081
    command: start-dev --import-realm
    volumes:
      - ./docker/keycloak/realms:/opt/keycloak/data/import
      - ./docker/keycloak/themes:/opt/keycloak/themes
    ports:
      - "8081:8080"
    depends_on:
      keycloak-db:
        condition: service_started
      mailhog:
        condition: service_started
    networks:
      - keycloak-network

  # SMTP de desarrollo — captura emails de recuperación (UI: http://localhost:8025)
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - keycloak-network

volumes:
  josanz_pgdata:
  keycloak_data:

networks:
  keycloak-network:
    driver: bridge
    