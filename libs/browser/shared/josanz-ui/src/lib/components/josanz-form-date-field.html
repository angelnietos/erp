<div class="josanz-form-date-field" [formGroup]="parentForm">
  @if (label) {
  <label
    class="josanz-form-date-field__label"
    [attr.for]="controlName || null"
    [style.color]="'var(--josanz-label-muted)'"
  >
    {{ label }}
    @if (showRequiredMarker) {
    <span class="josanz-form-date-field__required" aria-hidden="true"> *</span>
    }
  </label>
  }

  <div class="josanz-form-date-field__wrap">
    <button
      type="button"
      class="josanz-form-date-field__trigger"
      [class.josanz-form-date-field__trigger--invalid]="hasError"
      [class.josanz-form-date-field__trigger--open]="panelOpen()"
      [ngClass]="fieldCornerClass()"
      [disabled]="control?.disabled ?? false"
      [attr.aria-expanded]="panelOpen()"
      [attr.aria-haspopup]="'dialog'"
      [attr.aria-invalid]="hasError"
      (click)="togglePanel($event)"
    >
      <span
        class="josanz-form-date-field__value"
        [class.josanz-form-date-field__value--placeholder]="!displayValue()"
      >
        {{ displayValue() || placeholder }}
      </span>
      <span class="josanz-form-date-field__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </span>
    </button>

    @if (panelOpen()) {
    <div class="josanz-form-date-field__panel" role="dialog" aria-label="Seleccionar fecha">
      <header class="josanz-form-date-field__panel-header">
        <button type="button" class="josanz-form-date-field__nav" aria-label="Mes anterior" (click)="moveMonth(-1)">
          ‹
        </button>
        <span class="josanz-form-date-field__month">{{ monthLabel }}</span>
        <button type="button" class="josanz-form-date-field__nav" aria-label="Mes siguiente" (click)="moveMonth(1)">
          ›
        </button>
      </header>

      <div class="josanz-form-date-field__weekdays" aria-hidden="true">
        @for (day of ['L', 'M', 'X', 'J', 'V', 'S', 'D']; track day) {
        <span>{{ day }}</span>
        }
      </div>

      <div class="josanz-form-date-field__grid">
        @for (cell of calendarDays; track cell.date) {
        <button
          type="button"
          class="josanz-form-date-field__day"
          [class.josanz-form-date-field__day--muted]="!cell.inCurrentMonth"
          [class.josanz-form-date-field__day--today]="cell.isToday"
          [class.josanz-form-date-field__day--selected]="cell.isSelected"
          [attr.aria-label]="cell.date"
          [attr.aria-pressed]="cell.isSelected"
          (click)="selectDate(cell)"
        >
          {{ cell.day }}
        </button>
        }
      </div>

      <footer class="josanz-form-date-field__footer">
        <button type="button" class="josanz-form-date-field__footer-btn" (click)="clearDate()">Borrar</button>
        <button type="button" class="josanz-form-date-field__footer-btn josanz-form-date-field__footer-btn--primary" (click)="selectToday()">
          Hoy
        </button>
      </footer>
    </div>
    }
  </div>

  @if (errorText) {
  <p class="josanz-form-date-field__error" role="alert">{{ errorText }}</p>
  }
</div>
