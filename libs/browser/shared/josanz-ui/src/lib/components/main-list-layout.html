<div class="w-full flex flex-col gap-6 relative min-h-0 flex-1">
  <!-- Header -->
  <div class="flex justify-between items-center w-full">
    <h1
      class="text-[28px] font-bold tracking-tight"
      [style.color]="themeService.currentTheme().atmosphere.text"
    >
      {{ title }}
    </h1>
    <josanz-user-avatar></josanz-user-avatar>
  </div>

  <!-- Filters and Actions -->
  <div class="flex justify-between items-center w-full mt-2">
    <div class="flex flex-col gap-4">
      <josanz-filter-tabs 
        [options]="filterOptions" 
        (selectionChange)="onFilterChange($event)">
      </josanz-filter-tabs>
      <!-- Slot for extra filters if needed (like in Stock) -->
      <ng-content select="[extra-filters]"></ng-content>
    </div>
    
    <div class="flex gap-4 items-center">
      <josanz-secondary-button 
        label="Excel" 
        (btnClick)="onExcelAction()">
      </josanz-secondary-button>
      
      <!-- Slot for extra action buttons -->
      <ng-content select="[extra-actions]"></ng-content>

      <josanz-button 
        [label]="primaryBtnLabel" 
        [showIcon]="false"
        (btnClick)="onPrimaryAction()">
      </josanz-button>
    </div>
  </div>

  <!-- Content List -->
  <div class="flex flex-col gap-4 mt-4 flex-1">
    <ng-content></ng-content>
  </div>

  <!-- Pagination -->
  <div class="flex justify-end mt-6" *ngIf="paginationTotal > 0">
    <josanz-pagination
      [current]="effectivePaginationPage"
      [total]="paginationTotal"
      (pageChange)="onPaginationPage($event)"
    ></josanz-pagination>
  </div>
</div>
