<div class="w-full flex flex-col gap-6 relative min-h-0 flex-1">
  <!-- Header -->
  <div class="flex justify-between items-center w-full">
    <h1
      class="text-[24px] md:text-[32px] font-bold tracking-tight"
      [style.color]="'var(--josanz-text)'"
    >
      {{ title }}
    </h1>
    <josanz-user-avatar></josanz-user-avatar>
  </div>

  <!-- Filters and Actions -->
  <div class="flex flex-col md:flex-row md:justify-between md:items-center w-full mt-2 gap-6">
    <div class="flex flex-col gap-4 w-full md:w-auto">
      <josanz-filter-tabs 
        [options]="filterOptions" 
        (selectionChange)="onFilterChange($event)">
      </josanz-filter-tabs>
      <!-- Slot for extra filters if needed (like in Stock) -->
      <ng-content select="[extra-filters]"></ng-content>
    </div>
    
    <div class="flex flex-wrap gap-3 items-center w-full md:w-auto md:justify-end">
      <div class="flex-1 md:flex-initial">
        <josanz-secondary-button 
          label="Excel" 
          class="w-full"
          (btnClick)="onExcelAction()">
        </josanz-secondary-button>
      </div>
      
      <!-- Slot for extra action buttons -->
      <ng-content select="[extra-actions]"></ng-content>

      <div class="flex-1 md:flex-initial">
        <josanz-button 
          [label]="primaryBtnLabel" 
          [showIcon]="false"
          [fullWidth]="true"
          (btnClick)="onPrimaryAction()">
        </josanz-button>
      </div>
    </div>
  </div>

  <!-- Content List -->
  <div class="flex flex-col gap-4 mt-4 flex-1">
    <ng-content></ng-content>
  </div>

  <!-- Pagination -->
  @if (paginationTotal > 0) {
    <div class="flex justify-center md:justify-end mt-6">
      <josanz-pagination
        [current]="effectivePaginationPage"
        [total]="paginationTotal"
        (pageChange)="onPaginationPage($event)"
      ></josanz-pagination>
    </div>
  }
</div>
