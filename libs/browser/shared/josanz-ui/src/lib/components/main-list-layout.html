<div class="josanz-main-list flex w-full min-w-0 flex-col gap-6">
  <div class="flex w-full min-w-0 shrink-0 flex-col gap-6">
    <div class="flex w-full min-w-0 justify-between items-start">
      <div class="flex flex-col gap-1">
        <h1
          class="text-[26px] md:text-[36px] font-black tracking-tight leading-none"
          [style.color]="'var(--josanz-text)'"
        >
          {{ title }}
        </h1>
        <div
          class="h-[3px] w-12 rounded-full"
          [style.background]="'linear-gradient(90deg, var(--josanz-primary), transparent)'"
        ></div>
      </div>
      <josanz-user-avatar [link]="avatarLink" [ariaLabel]="avatarAriaLabel"></josanz-user-avatar>
    </div>

    <div
      class="flex w-full min-w-0 flex-col gap-4 md:flex-row md:items-start md:justify-between md:gap-6"
    >
      <div class="flex w-full min-w-0 flex-col gap-3 md:flex-1">
        <josanz-filter-tabs [options]="filterOptions" (selectionChange)="onFilterChange($event)"></josanz-filter-tabs>
        <ng-content select="[extra-filters]"></ng-content>
      </div>

      <div
        class="flex w-full min-w-0 shrink-0 flex-wrap items-center gap-2 md:w-auto md:max-w-full md:flex-none md:justify-end"
      >
        <div class="min-w-0 flex-1 md:flex-initial">
          <josanz-secondary-button label="Excel" class="w-full" (btnClick)="onExcelAction()"></josanz-secondary-button>
        </div>
        <ng-content select="[extra-actions]"></ng-content>
        <div class="min-w-0 flex-1 md:flex-initial">
          <josanz-button
            [label]="primaryBtnLabel"
            [showIcon]="true"
            [fullWidth]="true"
            (btnClick)="onPrimaryAction()"
          ></josanz-button>
        </div>
      </div>
    </div>
  </div>

  <div
    class="josanz-main-list__stack flex w-full min-w-0 flex-col"
    style="gap: var(--josanz-list-stack-gap)"
  >
    <ng-content></ng-content>
  </div>

  @if (paginationTotal > 0) {
    <div
      class="flex w-full shrink-0 justify-center border-t pt-6 md:justify-end"
      [style.borderColor]="'var(--josanz-border)'"
    >
      <josanz-pagination
        [current]="effectivePaginationPage"
        [total]="paginationTotal"
        [variant]="paginationVariant"
        (pageChange)="onPaginationPage($event)"
      ></josanz-pagination>
    </div>
  }
</div>
