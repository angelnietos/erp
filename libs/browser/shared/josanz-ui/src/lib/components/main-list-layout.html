<div class="w-full flex flex-col gap-6 relative min-h-[calc(100vh-80px)]">
  <!-- Header -->
  <div class="flex justify-between items-center w-full">
    <h1 class="text-[28px] font-bold text-[#1A1A1A] tracking-tight">{{ title }}</h1>
    <josanz-user-avatar></josanz-user-avatar>
  </div>

  <!-- Filters and Actions -->
  <div class="flex justify-between items-center w-full mt-2">
    <josanz-filter-tabs 
      [options]="filterOptions" 
      (selectionChange)="onFilterChange($event)">
    </josanz-filter-tabs>
    
    <div class="flex gap-4 items-center">
      <josanz-secondary-button 
        label="Excel" 
        (btnClick)="onExcelAction()">
      </josanz-secondary-button>
      <josanz-button 
        [label]="primaryBtnLabel" 
        (btnClick)="onPrimaryAction()">
      </josanz-button>
    </div>
  </div>

  <!-- Content List -->
  <div class="flex flex-col gap-4 mt-4 flex-1">
    <ng-content></ng-content>
  </div>

  <!-- Pagination -->
  <div class="flex justify-end mt-6">
    <josanz-pagination [current]="0" [total]="0"></josanz-pagination>
  </div>
</div>
