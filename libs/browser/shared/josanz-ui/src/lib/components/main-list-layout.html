<div class="w-full flex flex-col gap-6 relative min-h-0 flex-1">

  <!-- Header -->
  <div class="flex justify-between items-start w-full">
    <div class="flex flex-col gap-1">
      <h1
        class="text-[26px] md:text-[36px] font-black tracking-tight leading-none"
        [style.color]="'var(--josanz-text)'"
      >
        {{ title }}
      </h1>
      <!-- Subtle accent line under title -->
      <div 
        class="h-[3px] w-12 rounded-full"
        [style.background]="'linear-gradient(90deg, var(--josanz-primary), transparent)'"
      ></div>
    </div>
    <josanz-user-avatar [link]="avatarLink" [ariaLabel]="avatarAriaLabel"></josanz-user-avatar>
  </div>

  <!-- Filters and Actions -->
  <div class="flex flex-col md:flex-row md:justify-between md:items-start w-full mt-1 gap-4">
    <!-- Left: filters -->
    <div class="flex flex-col gap-3 w-full md:w-auto">
      <josanz-filter-tabs 
        [options]="filterOptions" 
        (selectionChange)="onFilterChange($event)">
      </josanz-filter-tabs>
      <!-- Slot for extra filters (Stock etc.) -->
      <ng-content select="[extra-filters]"></ng-content>
    </div>
    
    <!-- Right: actions -->
    <div class="flex flex-wrap gap-2 items-center w-full md:w-auto md:justify-end shrink-0">
      <div class="flex-1 md:flex-initial min-w-0">
        <josanz-secondary-button 
          label="Excel" 
          class="w-full"
          (btnClick)="onExcelAction()">
        </josanz-secondary-button>
      </div>
      
      <!-- Slot for extra action buttons -->
      <ng-content select="[extra-actions]"></ng-content>

      <div class="flex-1 md:flex-initial min-w-0">
        <josanz-button 
          [label]="primaryBtnLabel" 
          [showIcon]="true"
          [fullWidth]="true"
          (btnClick)="onPrimaryAction()">
        </josanz-button>
      </div>
    </div>
  </div>

  <!-- Content List -->
  <div class="flex flex-col flex-1">
    <ng-content></ng-content>
  </div>

  <!-- Pagination -->
  @if (paginationTotal > 0) {
    <div class="flex justify-center md:justify-end mt-4 pb-2">
      <josanz-pagination
        [current]="effectivePaginationPage"
        [total]="paginationTotal"
        (pageChange)="onPaginationPage($event)"
      ></josanz-pagination>
    </div>
  }
</div>
