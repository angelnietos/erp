@if (hasLink()) {
  <a
    [routerLink]="routerTarget()"
    [class]="linkShellClass()"
    [ngStyle]="shellStyle()"
    [style.color]="iconTone()"
    [attr.aria-label]="ariaLabel"
  >
    <ng-container *ngTemplateOutlet="avatarIcon"></ng-container>
  </a>
} @else {
  <div
    [class]="shellClass()"
    [ngStyle]="shellStyle()"
    [style.color]="iconTone()"
  >
    <ng-container *ngTemplateOutlet="avatarIcon"></ng-container>
  </div>
}

<ng-template #avatarIcon>
  @switch (effectiveRoleBadge()) {
    @case ('superadmin') {
      <!-- Rayman-inspired magical wizard character with floating elements -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <!-- Head/face -->
        <circle cx="12" cy="8" r="4" />
        <!-- Eyes -->
        <circle cx="10" cy="7" r="1" />
        <circle cx="14" cy="7" r="1" />
        <!-- Smile -->
        <path d="M10 10 q2 2 4 0" />
        <!-- Floating magical hands (Rayman style) -->
        <path d="M4 12 c4 -4 8 -4 12 0" />
        <path d="M4 16 c4 4 8 4 12 0" />
        <!-- Magic sparkles -->
        <path d="M2 8 m-2,0 a2,2 0 1,1 4,0 a2,2 0 1,1 -4,0" />
        <path d="M22 16 m-2,0 a2,2 0 1,1 4,0 a2,2 0 1,1 -4,0" />
        <!-- Floating orb/scepter -->
        <circle cx="12" cy="18" r="2" />
      </svg>
    }
    @case ('admin') {
      <!-- Nintendo-inspired captain/admiral character -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <!-- Head/helmet -->
        <path d="M4 8 a8 8 0 0 1 16 0" />
        <!-- Face -->
        <circle cx="12" cy="12" r="3" />
        <!-- Eyes -->
        <circle cx="10" cy="11" r="1" />
        <circle cx="14" cy="11" r="1" />
        <!-- Determined expression -->
        <path d="M8 14 h8" />
        <!-- Naval uniform details -->
        <path d="M12 8 v4" />
        <path d="M8 12 h8" />
        <!-- Epaulettes -->
        <circle cx="8" cy="10" r="1.5" />
        <circle cx="16" cy="10" r="1.5" />
      </svg>
    }
    @case ('manager') {
      <!-- Rockstar-inspired band manager/producer character -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <!-- Head with stylish hair -->
        <path d="M8 6 c4 -3 8 0 8 0" />
        <circle cx="12" cy="10" r="3" />
        <!-- Sunglasses (Rockstar style) -->
        <rect x="9" y="9" width="6" height="2" rx="1" />
        <!-- Confident smile -->
        <path d="M10 13 q2 2 4 0" />
        <!-- Stylish jacket/collar -->
        <path d="M6 14 h12" />
        <path d="M8 16 h8" />
        <!-- Gold chain -->
        <circle cx="12" cy="14" r="1.5" />
        <!-- Microphone (symbol of management) -->
        <path d="M12 6 v4" />
        <path d="M10 10 h4" />
      </svg>
    }
    @case ('operator') {
      <!-- Nintendo-inspired worker/technician character -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <!-- Head with safety helmet -->
        <path d="M6 8 h12" />
        <path d="M8 6 h8" />
        <path d="M10 4 v4" />
        <path d="M14 4 v4" />
        <!-- Face -->
        <circle cx="12" cy="12" r="3" />
        <!-- Eyes -->
        <circle cx="10" cy="11" r="1" />
        <circle cx="14" cy="11" r="1" />
        <!-- Friendly expression -->
        <path d="M10 14 q2 1 4 0" />
        <!-- Work uniform -->
        <path d="M8 16 h8" />
        <path d="M10 18 h4" />
        <!-- Tool belt -->
        <path d="M6 18 h12" />
        <!-- Wrench tool -->
        <path d="M9 20 l3 -3" />
        <path d="M12 17 l3 3" />
      </svg>
    }
    @default {
      <!-- Enhanced default user with more personality -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        [ngClass]="
          size === 'sm'
            ? 'transition-colors group-hover:opacity-80'
            : 'transition-colors'
        "
        aria-hidden="true"
      >
        <!-- Head with playful hair -->
        <path d="M8 6 c2 -2 4 0 4 0" />
        <circle cx="12" cy="10" r="4" />
        <!-- Eyes -->
        <circle cx="10" cy="9" r="1.5" />
        <circle cx="14" cy="9" r="1.5" />
        <!-- Warm smile -->
        <path d="M10 12 q2 2 4 0" />
        <!-- Body/shirt -->
        <path d="M8 16 h8" />
        <path d="M10 18 h4" />
        <!-- Arms -->
        <path d="M6 16 h2" />
        <path d="M16 16 h2" />
        <!-- Legs -->
        <path d="M10 22 v4" />
        <path d="M14 22 v4" />
        <!-- Feet -->
        <path d="M8 26 h2" />
        <path d="M14 26 h2" />
      </svg>
    }
  }
</ng-template>
