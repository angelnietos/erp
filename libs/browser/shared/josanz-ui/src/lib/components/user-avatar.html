<div
  [class]="shellClass()"
  [ngStyle]="shellStyle()"
  [style.color]="iconTone()"
>
  <svg
    [attr.width]="size === 'lg' ? 32 : 20"
    [attr.height]="size === 'lg' ? 32 : 20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    [ngClass]="
      size === 'sm'
        ? 'transition-colors group-hover:opacity-80'
        : 'transition-colors'
    "
    aria-hidden="true"
  >
    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
    <circle cx="12" cy="7" r="4" />
  </svg>
</div>
