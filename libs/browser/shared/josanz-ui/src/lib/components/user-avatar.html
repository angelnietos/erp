@if (hasLink()) {
  <a
    [routerLink]="routerTarget()"
    [class]="linkShellClass()"
    [ngStyle]="shellStyle()"
    [style.color]="iconTone()"
    [attr.aria-label]="ariaLabel"
  >
    <ng-container *ngTemplateOutlet="avatarIcon"></ng-container>
  </a>
} @else {
  <div
    [class]="shellClass()"
    [ngStyle]="shellStyle()"
    [style.color]="iconTone()"
  >
    <ng-container *ngTemplateOutlet="avatarIcon"></ng-container>
  </div>
}

<ng-template #avatarIcon>
  @switch (effectiveRoleBadge()) {
    @case ('superadmin') {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 3.5c1.8 2.2 4.2 3.5 7 3.8-1.2 2.8-3.4 5-6.2 5.9-.4-2.4-1.6-4.6-3.5-6.2.9-1.2 1.7-2.5 2.7-3.5z" />
        <path d="M6.5 19.5c1.8-1.2 3.6-1.8 5.5-1.8s3.7.6 5.5 1.8" />
        <path d="M12 7.5v3.5" />
        <path d="M10.5 9.5h3" />
      </svg>
    }
    @case ('admin') {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 3l7 3v6c0 4.2-3 7.8-7 9-4-1.2-7-4.8-7-9V6l7-3z" />
        <path d="m9 12 2 2 4-4" />
      </svg>
    }
    @default {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        [ngClass]="
          size === 'sm'
            ? 'transition-colors group-hover:opacity-80'
            : 'transition-colors'
        "
        aria-hidden="true"
      >
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
    }
  }
</ng-template>
