@if (hasLink()) {
  <a
    [routerLink]="routerTarget()"
    [class]="linkShellClass()"
    [ngStyle]="shellStyle()"
    [style.color]="iconTone()"
    [attr.aria-label]="ariaLabel"
  >
    <ng-container *ngTemplateOutlet="avatarIcon"></ng-container>
  </a>
} @else {
  <div
    [class]="shellClass()"
    [ngStyle]="shellStyle()"
    [style.color]="iconTone()"
  >
    <ng-container *ngTemplateOutlet="avatarIcon"></ng-container>
  </div>
}

<ng-template #avatarIcon>
  @switch (effectiveRoleBadge()) {
    @case ('superadmin') {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
      >
        <path d="M12 2l3.1 5h5.6l-4.5 4.4 1.7 5.5-5-2.6-5 2.6 1.7-5.5-4.5-4.4h5.6L12 2z" />
      </svg>
    }
    @case ('admin') {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
      >
        <path d="M12 2l2.8 3.2V7c0 3.3-2.7 6.7-6 8l-.5.2V12" />
        <path d="M12 2l-2.8 3.2V7c0 3.3 2.7 6.7 6 8l.5.2V12" />
        <path d="M8 13.5l2 2 4-4" />
      </svg>
    }
    @default {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        [ngClass]="
          size === 'sm'
            ? 'transition-colors group-hover:opacity-80'
            : 'transition-colors'
        "
        aria-hidden="true"
      >
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
    }
  }
</ng-template>
