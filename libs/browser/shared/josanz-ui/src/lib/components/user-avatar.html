@if (hasLink()) {
  <a
    [routerLink]="routerTarget()"
    [class]="linkShellClass()"
    [ngStyle]="shellStyle()"
    [style.color]="iconTone()"
    [attr.aria-label]="ariaLabel"
  >
    <ng-container *ngTemplateOutlet="avatarIcon"></ng-container>
  </a>
} @else {
  <div
    [class]="shellClass()"
    [ngStyle]="shellStyle()"
    [style.color]="iconTone()"
  >
    <ng-container *ngTemplateOutlet="avatarIcon"></ng-container>
  </div>
}

<ng-template #avatarIcon>
  @switch (effectiveRoleBadge()) {
    @case ('superadmin') {
      <!-- Premium Superadmin: Crown / Shield hybrid geometric -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        class="transition-transform duration-300 group-hover:scale-110"
      >
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <path d="M12 8v8" />
        <path d="M9 12h6" />
      </svg>
    }
    @case ('admin') {
      <!-- Premium Admin: Hexagon with inner star -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        class="transition-transform duration-300 group-hover:scale-110"
      >
        <path d="M12 2l8.66 5v10L12 22l-8.66-5V7L12 2z" />
        <path d="M12 7l1.45 4.47h4.7l-3.8 2.76 1.45 4.47L12 15.94l-3.8 2.76 1.45-4.47-3.8-2.76h4.7L12 7z" />
      </svg>
    }
    @case ('manager') {
      <!-- Premium Manager: Elegant layers/chart or briefcase -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        class="transition-transform duration-300 group-hover:scale-110"
      >
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
        <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
        <path d="M12 12v.01" />
      </svg>
    }
    @case ('operator') {
      <!-- Premium Operator: Minimalist gear/activity -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        class="transition-transform duration-300 group-hover:scale-110 group-hover:rotate-45"
      >
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    }
    @default {
      <!-- Premium Default: Elegant modern user silhouette -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="transition-transform duration-300 group-hover:scale-110"
        aria-hidden="true"
      >
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
    }
  }
</ng-template>
