@if (hasLink()) {
  <a
    [routerLink]="routerTarget()"
    [class]="linkShellClass()"
    [ngStyle]="shellStyle()"
    [style.color]="iconTone()"
    [attr.aria-label]="ariaLabel"
  >
    <ng-container *ngTemplateOutlet="avatarIcon"></ng-container>
  </a>
} @else {
  <div
    [class]="shellClass()"
    [ngStyle]="shellStyle()"
    [style.color]="iconTone()"
  >
    <ng-container *ngTemplateOutlet="avatarIcon"></ng-container>
  </div>
}

<ng-template #avatarIcon>
  @switch (effectiveRoleBadge()) {
    @case ('superadmin') {
      <!-- Rayman-inspired magical wizard with mystical hat and floating hands -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <!-- Mystical pointed hat -->
        <path d="M8 6 h8 v2 h-2 c0-1-1-2-2-2s-2 1-2 2h-2z" />
        <path d="M11 5 l1 2" />
        <!-- Face -->
        <circle cx="12" cy="12" r="4" />
        <!-- Magical glowing eyes -->
        <circle cx="10" cy="11" r="1.2" fill="currentColor" />
        <circle cx="14" cy="11" r="1.2" fill="currentColor" />
        <!-- Spellcaster smile -->
        <path d="M10 14 q2 1 4 0" />
        <!-- Floating magical hands (Rayman style - no arms) -->
        <path d="M4 10 c3-2 5 1 8 0" />
        <path d="M12 10 c3-1 5 2 8 0" />
        <path d="M3 14 c2-1 4 1 6 0" />
        <path d="M15 14 c2-1 4 1 6 0" />
        <!-- Power orb -->
        <circle cx="12" cy="19" r="1.5" />
        <path d="M10 19 h4" />
      </svg>
    }
    @case ('admin') {
      <!-- Nintendo-inspired heroic captain with tricorn hat -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <!-- Tricorn hat -->
        <path d="M6 6 h12 l-2 2h-8z" />
        <path d="M8 6 v2" />
        <path d="M12 6 v2" />
        <path d="M16 6 v2" />
        <!-- Head -->
        <circle cx="12" cy="12" r="4" />
        <!-- Heroic eyes -->
        <circle cx="10" cy="11" r="1" />
        <circle cx="14" cy="11" r="1" />
        <!-- Determined expression -->
        <path d="M9 14 h6" />
        <!-- Admiral coat -->
        <path d="M8 16 h8" />
        <path d="M6 18 h12" />
        <!-- Medallion -->
        <circle cx="12" cy="17" r="1" />
        <!-- Anchor emblem -->
        <path d="M12 8 v2 M11 9 h2" />
      </svg>
    }
    @case ('manager') {
      <!-- Rockstar-inspired with guitar and cool style -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <!-- Stylish hair -->
        <path d="M8 6 c2 -1 4 0 8 1" />
        <path d="M7 7 h10" />
        <!-- Head -->
        <circle cx="12" cy="12" r="4" />
        <!-- Sunglasses (Rockstar style) -->
        <rect x="9" y="10" width="6" height="1.5" rx="0.5" />
        <path d="M9 10 l2 2" />
        <path d="M13 10 l-2 2" />
        <!-- Cool confident smile -->
        <path d="M10 15 q2 2 4 0" />
        <!-- Leather jacket -->
        <path d="M8 16 h8" />
        <path d="M6 18 h12" />
        <!-- Guitar neck -->
        <path d="M10 16 v3" />
        <path d="M14 16 v3" />
        <path d="M10 19 h4" />
        <!-- Sound waves -->
        <path d="M7 20 c1 -1 3-1 4 0" />
        <path d="M13 20 c1 -1 3-1 4 0" />
      </svg>
    }
    @case ('operator') {
      <!-- Nintendo-inspired mechanic/technician with safety gear -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <!-- Safety helmet -->
        <path d="M8 6 h8 v2 h-8z" />
        <path d="M10 4 h4" />
        <path d="M12 4 v2" />
        <!-- Head -->
        <circle cx="12" cy="12" r="4" />
        <!-- Focused eyes -->
        <circle cx="10" cy="11" r="1" />
        <circle cx="14" cy="11" r="1" />
        <!-- Concentrated expression -->
        <path d="M9 14 h6" />
        <!-- Work vest -->
        <path d="M8 16 h8" />
        <path d="M6 18 h12" />
        <!-- Tool marks -->
        <path d="M9 18 h2" />
        <path d="M13 18 h2" />
        <!-- Wrench -->
        <rect x="8" y="20" width="2" height="1" />
        <rect x="14" y="20" width="2" height="1" />
      </svg>
    }
    @default {
      <!-- Playful character with friendly design -->
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        [ngClass]="size === 'sm' ? 'transition-all group-hover:opacity-90' : 'transition-all'"
        aria-hidden="true"
      >
        <!-- Hair -->
        <path d="M8 6 c2 -2 6-2 8 0" />
        <!-- Head -->
        <circle cx="12" cy="11" r="4" />
        <!-- Expressive eyes -->
        <circle cx="10" cy="10" r="1.2" />
        <circle cx="14" cy="10" r="1.2" />
        <!-- Warm smile -->
        <path d="M10 13 q2 2 4 0" />
        <!-- Simple body -->
        <path d="M8 16 h8" />
        <!-- Arms -->
        <path d="M6 16 v2" />
        <path d="M18 16 v2" />
      </svg>
    }
  }
</ng-template>
