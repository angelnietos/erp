<div class="josanz-theme-personalization">
  <section class="josanz-theme-section josanz-theme-section--atmospheres">
    <h3 class="premium-label">Atmósferas visuales</h3>
    <p class="premium-desc">
      Neutral White replica el export Figma. El resto son ambientes opcionales.
    </p>

    <div class="atmosphere-grid">
      @for (atm of allAtmospheres; track atm.name) {
        @let cfg = atmosphereConfig(atm.name);
        <button
          type="button"
          (click)="themeService.setAtmosphere(atm.name)"
          class="atmosphere-card"
          [class.active]="themeService.currentTheme().atmosphere.name === atm.name"
          [class.atmosphere-card--light]="cfg.isDark === false"
          [style.background]="cfg.background"
          [style.--atm-text]="cfg.text"
          [style.--atm-accent]="cfg.accent"
          [style.--atm-border]="cfg.border"
          [style.--atm-surface]="cfg.surface"
          [style.--atm-muted]="cfg.textMuted"
        >
          <div
            class="atmosphere-preview"
            [style.backgroundColor]="cfg.surface"
            [style.borderColor]="cfg.border"
            [style.boxShadow]="cfg.cardShadow ?? cfg.shadow"
          >
            <div class="atmosphere-preview__bar" [style.backgroundColor]="cfg.textMuted" aria-hidden="true"></div>
            <div class="atmosphere-preview__row" aria-hidden="true">
              <span class="atmosphere-preview__chip" [style.backgroundColor]="cfg.accent"></span>
              <span class="atmosphere-preview__line" [style.backgroundColor]="cfg.border"></span>
            </div>
          </div>
          <div class="atmosphere-card__footer">
            <span class="atmosphere-card__label">{{ atm.label }}</span>
            <span class="atmosphere-card__desc">{{ atm.description }}</span>
          </div>
          @if (themeService.currentTheme().atmosphere.name === atm.name) {
            <span class="atmosphere-card__badge" aria-hidden="true">Activa</span>
          }
        </button>
      }
    </div>
  </section>
</div>
