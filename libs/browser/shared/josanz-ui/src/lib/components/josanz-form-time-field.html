<div class="josanz-form-time-field" [formGroup]="parentForm">
  @if (label) {
  <label
    class="josanz-form-time-field__label"
    [attr.for]="controlName || null"
    [style.color]="'var(--josanz-label-muted)'"
  >
    {{ label }}
    @if (showRequiredMarker) {
    <span class="josanz-form-time-field__required" aria-hidden="true"> *</span>
    }
  </label>
  }

  <div class="josanz-form-time-field__wrap">
    <button
      type="button"
      class="josanz-form-time-field__trigger"
      [class.josanz-form-time-field__trigger--invalid]="hasError"
      [class.josanz-form-time-field__trigger--open]="panelOpen()"
      [ngClass]="fieldCornerClass()"
      [disabled]="control?.disabled ?? false"
      [attr.aria-expanded]="panelOpen()"
      [attr.aria-haspopup]="'dialog'"
      [attr.aria-invalid]="hasError"
      (click)="togglePanel($event)"
    >
      <span
        class="josanz-form-time-field__value"
        [class.josanz-form-time-field__value--placeholder]="!displayValue()"
      >
        {{ displayValue() || placeholder }}
      </span>
      <span class="josanz-form-time-field__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="12 7 12 12 15 14"></polyline>
        </svg>
      </span>
    </button>

    @if (panelOpen()) {
    <div class="josanz-form-time-field__panel" role="dialog" aria-label="Seleccionar hora">
      <div class="josanz-form-time-field__columns">
        <div class="josanz-form-time-field__column" role="listbox" aria-label="Horas">
          @for (hour of hours; track hour) {
          <button
            type="button"
            class="josanz-form-time-field__option"
            [class.josanz-form-time-field__option--selected]="hour === selectedHour"
            [attr.aria-selected]="hour === selectedHour"
            (click)="selectHour(hour)"
          >
            {{ hour }}
          </button>
          }
        </div>
        <div class="josanz-form-time-field__column" role="listbox" aria-label="Minutos">
          @for (minute of minutes; track minute) {
          <button
            type="button"
            class="josanz-form-time-field__option"
            [class.josanz-form-time-field__option--selected]="minute === selectedMinute"
            [attr.aria-selected]="minute === selectedMinute"
            (click)="selectMinute(minute)"
          >
            {{ minute }}
          </button>
          }
        </div>
      </div>
    </div>
    }
  </div>

  @if (errorText) {
  <p class="josanz-form-time-field__error" role="alert">{{ errorText }}</p>
  }
</div>
