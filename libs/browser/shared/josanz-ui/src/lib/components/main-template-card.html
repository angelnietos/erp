<div class="w-full h-[64px] bg-white rounded-[12px] shadow-[0px_10px_20px_0px_rgba(163,163,163,0.1)] flex items-center px-6 transition-all group border border-transparent hover:border-slate-100 mb-3">
  <div class="flex items-center w-full overflow-hidden">
    <!-- Column 1 (Title) -->
    <div class="text-[#222222] text-[14px] font-semibold truncate w-[180px] shrink-0">
      {{ title }}
    </div>

    <!-- Data Columns with fixed widths -->
    <div class="flex flex-1 items-center gap-4 overflow-hidden">
      @if (data[0]) {
        <div class="text-[#222222] text-[14px] font-medium truncate w-[200px] shrink-0 opacity-80">
          {{ data[0] }}
        </div>
      }
      @if (data[1]) {
        <div class="text-[#222222] text-[14px] font-medium truncate w-[150px] shrink-0 opacity-80">
          {{ data[1] }}
        </div>
      }
      @if (data[2]) {
        <div class="text-[#222222] text-[14px] font-medium truncate w-[150px] shrink-0 opacity-80">
          {{ data[2] }}
        </div>
      }
      @if (data[3]) {
        <div class="text-[#222222] text-[14px] font-medium truncate flex-1 shrink-0 opacity-80">
          {{ data[3] }}
        </div>
      }
    </div>

    <!-- Status badge (Right aligned) -->
    <div class="w-[120px] flex justify-center shrink-0">
      <span
        class="text-[12px] font-bold px-4 py-1.5 rounded-full leading-none shadow-sm transition-all inline-block"
        [style.backgroundColor]="statusVariant === 'success' ? '#22C55E' : (statusVariant === 'warning' ? '#F59E0B' : (statusVariant === 'error' ? '#EF4444' : '#000000'))"
        class="text-white"
      >
        {{ status }}
      </span>
    </div>
  </div>
</div>
