<div 
  [ngStyle]="getCardStyles()"
  class="josanz-list-card mb-3 md:mb-4 flex flex-col md:flex-row md:items-center w-full group border border-solid transition-all duration-300 gap-3 md:gap-0 relative overflow-hidden"
  [class.rounded-2xl]="themeService.currentTheme().defaultShape === 'rounded'"
  [class.rounded-none]="themeService.currentTheme().defaultShape === 'square'"
  [class.rounded-[40px]]="themeService.currentTheme().defaultShape === 'pill'"
>

  <!-- Accent left bar (desktop) / top bar (mobile) - atmosphere accent line -->
  <div 
    class="absolute left-0 top-0 bottom-0 w-[3px] md:block hidden rounded-l-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"
    [style.backgroundColor]="'var(--josanz-primary)'"
  ></div>
  <div 
    class="md:hidden absolute top-0 left-0 right-0 h-[2px] rounded-t-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"
    [style.backgroundColor]="'var(--josanz-primary)'"
  ></div>

  <!-- Content padding wrapper -->
  <div class="flex flex-col md:flex-row md:items-center w-full px-4 md:px-6 py-4 md:py-5 gap-3 md:gap-0">

    <!-- Title row: title + badge (badge visible on mobile only) -->
    <div class="flex items-center justify-between md:block md:w-[200px] shrink-0">
      <h3 
        class="text-[15px] md:text-[16px] font-extrabold tracking-tight leading-tight"
        [style.color]="'var(--josanz-text)'">
        {{ title }}
      </h3>
      <!-- Badge: mobile only -->
      <span 
        class="md:hidden px-3 py-1 text-[9px] font-black uppercase tracking-widest shadow-sm"
        [class.rounded-xl]="themeService.currentTheme().defaultShape === 'rounded'"
        [class.rounded-none]="themeService.currentTheme().defaultShape === 'square'"
        [class.rounded-full]="themeService.currentTheme().defaultShape === 'pill'"
        [ngStyle]="getBadgeStyles()"
      >
        {{ status }}
      </span>
    </div>

    <!-- Data fields -->
    <div class="flex flex-col md:flex-row md:flex-1 md:items-center gap-1 md:gap-6 overflow-hidden">
      @for (item of data; track item; let i = $index) {
        <div 
          class="shrink-0 text-[12px] md:text-[13px] font-medium flex items-center gap-1.5 md:truncate"
          [style.color]="'var(--josanz-text-muted)'"
          [class.md:w-[220px]]="i === 0"
          [class.md:w-[160px]]="i === 1 || i === 2"
          [class.md:flex-1]="i === 3"
        >
          @if (labels[i]) {
            <span 
              class="md:hidden text-[9px] font-black uppercase tracking-wider shrink-0"
              [style.color]="'var(--josanz-primary)'"
              style="opacity:0.75"
            >{{ labels[i] }}:</span>
          }
          <span class="hidden md:inline-flex w-1.5 h-1.5 rounded-full opacity-30 bg-current shrink-0"></span>
          <span class="truncate">{{ item }}</span>
        </div>
      }
    </div>

    <!-- Badge: desktop only -->
    <div class="hidden md:flex w-[140px] shrink-0 justify-end">
      <span 
        [ngStyle]="getBadgeStyles()"
        class="px-4 py-1.5 text-[10px] font-black flex items-center justify-center uppercase tracking-widest shadow-md"
        [class.rounded-xl]="themeService.currentTheme().defaultShape === 'rounded'"
        [class.rounded-none]="themeService.currentTheme().defaultShape === 'square'"
        [class.rounded-full]="themeService.currentTheme().defaultShape === 'pill'"
      >
        {{ status }}
      </span>
    </div>

  </div>
</div>
