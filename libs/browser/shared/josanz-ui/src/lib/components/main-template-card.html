<div class="bg-white rounded-[16px] shadow-[0px_4px_24px_rgba(0,0,0,0.06)] p-6 mb-4 flex items-center w-full group hover:shadow-lg transition-all duration-300 border border-transparent hover:border-slate-100">
  
  <!-- Columna 1: Título/Nombre -->
  <div class="w-[180px] shrink-0">
    <h3 class="text-[15px] font-bold text-[#222222] tracking-tight group-hover:text-black">
      {{ title }}
    </h3>
  </div>

  <!-- Columna 2: Datos Flexibles (Email, CIF, etc) -->
  <div class="flex flex-1 items-center gap-4 overflow-hidden">
    @for (item of data; track item; let i = $index) {
      <div 
        class="shrink-0 text-[14px] text-[#64748B] font-medium truncate"
        [class.w-[200px]]="i === 0"
        [class.w-[150px]]="i === 1 || i === 2"
        [class.flex-1]="i === 3"
      >
        {{ item }}
      </div>
    }
  </div>

  <!-- Columna 3: Estado (Badge Estandarizado 65x20px) -->
  <div class="w-[120px] shrink-0 flex justify-center">
    <span 
      [ngStyle]="getBadgeStyles()"
      class="w-[65px] h-[20px] text-white text-[10px] font-bold flex items-center justify-center uppercase tracking-wider shadow-sm"
    >
      {{ status }}
    </span>
  </div>

</div>
