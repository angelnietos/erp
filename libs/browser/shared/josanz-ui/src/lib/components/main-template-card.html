<div 
  [ngStyle]="getCardStyles()"
  class="rounded-[16px] p-6 mb-4 flex items-center w-full group border border-solid hover:brightness-[0.99] transition-[box-shadow,filter] duration-200">
  
  <!-- Columna 1: Título/Nombre -->
  <div class="w-[180px] shrink-0">
    <h3 
      [style.color]="themeService.currentTheme().atmosphere.text"
      class="text-[15px] font-bold tracking-tight">
      {{ title }}
    </h3>
  </div>

  <!-- Columna 2: Datos Flexibles -->
  <div class="flex flex-1 items-center gap-4 overflow-hidden">
    @for (item of data; track item; let i = $index) {
      <div 
        class="shrink-0 text-[14px] font-medium truncate"
        [style.color]="themeService.currentTheme().atmosphere.textMuted"
        [class.w-[200px]]="i === 0"
        [class.w-[150px]]="i === 1 || i === 2"
        [class.flex-1]="i === 3"
      >
        {{ item }}
      </div>
    }
  </div>

  <!-- Columna 3: Estado -->
  <div class="w-[120px] shrink-0 flex justify-center">
    <span 
      [ngStyle]="getBadgeStyles()"
      class="w-[65px] h-[20px] text-[10px] font-bold flex items-center justify-center uppercase tracking-wider shadow-sm"
    >
      {{ status }}
    </span>
  </div>

</div>
