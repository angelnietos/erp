<div
  [ngStyle]="getCardStyles()"
  class="josanz-list-card flex flex-col md:flex-row md:items-center w-full group border border-solid transition-all duration-300 gap-3 md:gap-0 relative overflow-hidden"
  [class.josanz-list-card--rounded]="activeShape() === 'rounded'"
  [class.josanz-list-card--square]="activeShape() === 'square'"
  [class.josanz-list-card--pill]="activeShape() === 'pill'"
>
  <!-- Barra lateral: solo si no hay avatar con color de rail -->
  @if (showStatusRail()) {
  <div
    class="josanz-list-card__status-rail absolute left-0 top-0 bottom-0 hidden md:block"
    [ngStyle]="getStatusRailStyles()"
    aria-hidden="true"
  ></div>
  <div
    class="josanz-list-card__status-rail josanz-list-card__status-rail--mobile absolute top-0 left-0 right-0 md:hidden"
    [ngStyle]="getStatusRailStyles()"
    aria-hidden="true"
  ></div>
  }

  <!-- Content padding wrapper -->
  <div
    class="josanz-list-template-row-wrap w-full min-w-0 px-[var(--josanz-list-card-pad-x)] py-3 md:px-[var(--josanz-list-card-pad-x-md)] md:py-4"
  >
    <!-- Title: avatar inline -->
    <div class="josanz-list-template-row__title shrink-0 min-w-0 mb-1 md:mb-0">
      <div class="flex min-w-0 items-center gap-2">
        @if (leadingMark) {
        <span
          class="josanz-list-card__leading flex h-5 w-5 shrink-0 items-center justify-center rounded-full border border-solid text-[9px] font-extrabold transition-all duration-200 shadow-sm"
          [ngStyle]="getLeadingMarkStyles()"
          aria-hidden="true"
        >
          {{ leadingMark }}
        </span>
        }
        <h3
          class="josanz-list-card__title min-w-0 truncate text-[14px] font-extrabold leading-snug tracking-tight md:text-[15px]"
        >
          {{ title }}
        </h3>
      </div>
    </div>

    <!-- Data fields -->
    <div class="josanz-list-template-row__fields overflow-hidden">
      @for (item of data; track item; let i = $index) {
      <div
        class="josanz-list-template-row__field josanz-list-card__field flex items-center text-[13px] md:text-[14px] font-medium md:truncate gap-1.5"
        [ngClass]="fieldWidthClass(i)"
      >
        @if (labels[i]) {
        <span
          class="md:hidden text-[10px] font-bold uppercase tracking-wider shrink-0 text-slate-500"
          >{{ labels[i] }}:</span
        >
        }
        <span
          class="hidden md:inline-flex w-1.5 h-1.5 rounded-full opacity-40 bg-current shrink-0"
        ></span>
        <span class="truncate">{{ item }}</span>
      </div>
      }
    </div>

    @if (status) {
    <div class="josanz-list-template-row__status flex shrink-0 justify-start">
      <span
        [ngStyle]="getBadgeStyles()"
        class="inline-flex items-center gap-1.5 px-3 py-1 text-[11px] font-bold rounded-full josanz-list-card__status-pill"
        [class.josanz-list-card__status-pill--outline]="statusBadgeStyle === 'outline'"
        [class.shadow-sm]="statusBadgeStyle !== 'outline'"
      >
        @if (showStatusIcon()) {
        <span
          class="josanz-list-card__status-icon-ring"
          [ngStyle]="statusIconRingStyles()"
          aria-hidden="true"
        >
          <span class="josanz-list-card__status-icon">{{ statusIcon() }}</span>
        </span>
        }
        {{ status }}
      </span>
    </div>
    }
  </div>
</div>
