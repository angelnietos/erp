<div class="w-full h-[64px] bg-white rounded-[12px] shadow-[0px_10px_20px_0px_rgba(163,163,163,0.15)] flex items-center px-6 transition-all group">
  <div class="flex items-center w-full gap-4 overflow-hidden">
    <!-- Title column (fixed width) -->
    <div class="text-[#222222] text-[14px] font-medium truncate min-w-[120px]">
      {{ title }}
    </div>

    <!-- Dynamic data columns -->
    <div class="flex flex-1 items-center gap-6 overflow-hidden">
      @for (item of data; track item) {
        <div class="text-[#222222] text-[14px] font-medium leading-none truncate opacity-80 group-hover:opacity-100 transition-opacity">
          {{ item }}
        </div>
      }
    </div>

    <!-- Status badge -->
    <div class="flex-shrink-0 ml-auto">
      <span
        class="text-[12px] font-medium px-4 py-1.5 rounded-full leading-none shadow-sm transition-transform group-hover:scale-105 inline-block"
        [ngClass]="{
          'bg-[#635BFF] text-white border border-transparent': statusVariant === 'primary',
          'bg-green-500 text-white border border-transparent': statusVariant === 'success',
          'bg-amber-500 text-white border border-transparent': statusVariant === 'warning',
          'bg-red-500 text-white border border-transparent': statusVariant === 'error'
        }"
      >
        {{ status }}
      </span>
    </div>
  </div>
</div>
