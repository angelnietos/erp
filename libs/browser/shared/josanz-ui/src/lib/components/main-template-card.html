<div class="w-full h-[64px] bg-white rounded-xl shadow-sm border border-slate-100 flex items-center px-6 transition-all hover:shadow-md hover:border-slate-200 group">
  <div class="flex items-center w-full gap-4 overflow-hidden">
    <!-- Title column (fixed width) -->
    <div class="text-slate-900 text-sm font-bold truncate min-w-[120px]">
      {{ title }}
    </div>

    <!-- Dynamic data columns -->
    <div class="flex flex-1 items-center gap-6 overflow-hidden">
      @for (item of data; track item) {
        <div
          class="text-slate-500 text-xs font-medium leading-none truncate opacity-80 group-hover:opacity-100 transition-opacity"
        >
          {{ item }}
        </div>
      }
    </div>

    <!-- Status badge -->
    <div class="flex-shrink-0 ml-auto">
      <span
        class="text-[10px] font-black px-4 py-2 rounded-lg leading-none uppercase tracking-wider shadow-sm transition-transform group-hover:scale-105 inline-block"
        [ngClass]="{
          'bg-blue-50 text-blue-600 border border-blue-100': statusVariant === 'primary',
          'bg-green-50 text-green-600 border border-green-100': statusVariant === 'success',
          'bg-amber-50 text-amber-600 border border-amber-100': statusVariant === 'warning',
          'bg-red-50 text-red-600 border border-red-100': statusVariant === 'error'
        }"
      >
        {{ status }}
      </span>
    </div>
  </div>
</div>
