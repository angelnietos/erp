<div
  [ngStyle]="getCardStyles()"
  class="josanz-list-card flex flex-col md:flex-row md:items-center w-full group border border-solid transition-all duration-300 gap-3 md:gap-0 relative overflow-hidden"
  [class.rounded-2xl]="activeShape() === 'rounded'"
  [class.rounded-none]="activeShape() === 'square'"
  [class.rounded-[40px]]="activeShape() === 'pill'"
>
  <!-- Barra de estado (Figma): color del pill, siempre visible -->
  <div
    class="josanz-list-card__status-rail absolute left-0 top-0 bottom-0 hidden md:block rounded-l-2xl"
    [ngStyle]="getStatusRailStyles()"
    aria-hidden="true"
  ></div>
  <div
    class="josanz-list-card__status-rail josanz-list-card__status-rail--mobile absolute top-0 left-0 right-0 md:hidden rounded-t-2xl"
    [ngStyle]="getStatusRailStyles()"
    aria-hidden="true"
  ></div>

  <!-- Content padding wrapper -->
  <div
    class="josanz-list-template-row-wrap w-full min-w-0 px-[var(--josanz-list-card-pad-x)] py-[var(--josanz-list-card-pad-y)] md:px-[var(--josanz-list-card-pad-x-md)] md:py-[var(--josanz-list-card-pad-y-md)]"
  >
    <!-- Title row: ID / título (sin pastilla — estado solo en columna derecha) -->
    <div class="josanz-list-template-row__title shrink-0 min-w-0">
      <div class="flex min-w-0 items-center gap-2.5">
        @if (leadingMark) {
        <span
          class="josanz-list-card__leading flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-solid text-[10px] font-extrabold"
          [style.borderColor]="'var(--josanz-border)'"
          [style.backgroundColor]="'var(--josanz-surface-muted)'"
          [style.color]="'var(--josanz-text)'"
          aria-hidden="true"
        >
          {{ leadingMark }}
        </span>
        }
        <h3
          class="min-w-0 truncate text-[15px] font-extrabold leading-tight tracking-tight md:text-[16px]"
          [style.color]="'var(--josanz-text)'"
        >
          {{ title }}
        </h3>
      </div>
    </div>

    <!-- Data fields -->
    <div class="josanz-list-template-row__fields overflow-hidden">
      @for (item of data; track item; let i = $index) {
      <div
        class="josanz-list-template-row__field text-[12px] md:text-[13px] font-medium md:truncate"
        [ngClass]="fieldWidthClass(i)"
        [style.color]="'var(--josanz-text-muted)'"
      >
        @if (labels[i]) {
        <span
          class="md:hidden text-[9px] font-black uppercase tracking-wider shrink-0"
          [style.color]="'var(--josanz-primary)'"
          style="opacity: 0.75"
          >{{ labels[i] }}:</span
        >
        }
        <span
          class="hidden md:inline-flex w-1.5 h-1.5 rounded-full opacity-30 bg-current shrink-0"
        ></span>
        <span class="truncate">{{ item }}</span>
      </div>
      }
    </div>

    @if (status) {
    <div class="josanz-list-template-row__status flex shrink-0 justify-end">
      <span
        [ngStyle]="getBadgeStyles()"
        class="inline-flex items-center gap-1.5 px-3 py-1 text-[11px] font-bold rounded-full josanz-list-card__status-pill"
        [class.josanz-list-card__status-pill--outline]="statusBadgeStyle === 'outline'"
        [class.shadow-sm]="statusBadgeStyle !== 'outline'"
      >
        @if (showStatusIcon()) {
        <span class="josanz-list-card__status-icon" aria-hidden="true">{{ statusIcon() }}</span>
        }
        {{ status }}
      </span>
    </div>
    }
  </div>
</div>
