<div
  class="p-4 md:p-6 flex flex-col md:flex-row gap-4 md:gap-8 border border-solid transition-all group overflow-hidden hover:brightness-[1.02] hover:-translate-y-1 duration-300"
  [class.rounded-2xl]="themeService.currentTheme().defaultShape === 'rounded'"
  [class.rounded-none]="themeService.currentTheme().defaultShape === 'square'"
  [class.rounded-[32px]]="themeService.currentTheme().defaultShape === 'pill'"
  [ngStyle]="shellStyle()"
>
  <!-- Image Vertical (Figma Style) -->
  <div
    class="w-full md:w-[186px] h-[200px] md:h-[186px] shrink-0 rounded-[12px] overflow-hidden shadow-inner"
    [style.backgroundColor]="themeService.currentTheme().atmosphere.border"
  >
    <img [src]="imageUrl" alt="Event image" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
  </div>

  <!-- Content -->
  <div class="flex-1 flex flex-col justify-between py-1">
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h3
          class="text-[18px] font-semibold tracking-tight"
          [style.color]="themeService.currentTheme().atmosphere.text"
        >
          {{ title }}
        </h3>
        <span
          class="text-[10px] font-bold px-3 py-1 rounded-[10px] uppercase"
          [ngStyle]="badgeStyle()"
        >
          {{ badgeText }}
        </span>
      </div>

      <div
        class="flex gap-4 text-[13px] font-medium"
        [style.color]="themeService.currentTheme().atmosphere.textMuted"
      >
        <span>{{ subtitle }}</span>
        @if (data && data[0]) {
          <span class="flex items-center gap-1">
            <span
              class="w-1 h-1 rounded-full"
              [style.backgroundColor]="themeService.currentTheme().atmosphere.textMuted"
            ></span>
            {{ data[0] }}
          </span>
        }
      </div>

      <p
        class="text-[14px] leading-relaxed line-clamp-3"
        [style.color]="themeService.currentTheme().atmosphere.textMuted"
      >
        {{ description }}
      </p>
    </div>

    <!-- Tags (Bottom) -->
    <div class="flex flex-wrap gap-2 mt-4">
      @for (tag of tags; track tag) {
        <span
          class="px-3 py-1 border border-solid rounded-full text-[11px] font-semibold transition-colors cursor-default"
          [style.backgroundColor]="themeService.currentTheme().atmosphere.surface"
          [style.borderColor]="themeService.currentTheme().atmosphere.border"
          [style.color]="themeService.currentTheme().atmosphere.textMuted"
        >
          {{ tag }}
        </span>
      }
    </div>
  </div>
</div>
