<div class="h-screen flex flex-col items-center py-8 transition-all duration-300 relative z-[100] w-[44px] bg-white shadow-[4px_0px_24px_rgba(234,234,234,0.8)] border-r border-slate-100"
     [style.backgroundColor]="themeService.currentTheme().atmosphere.surface"
     [style.borderColor]="themeService.currentTheme().atmosphere.border">

  <!-- Top Decorative Corner (Figma style) -->
  <div class="absolute top-0 right-0 w-4 h-4 bg-transparent shadow-[4px_-4px_0_0_white] rounded-tr-xl"></div>

  <!-- Logo Section -->
  <div class="mb-14 flex items-center justify-center w-full px-1">
    <div class="w-8 h-10 flex items-center justify-center shrink-0 cursor-pointer">
      <svg width="24" height="24" viewBox="0 0 41 45" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 45H10.5V14.5H0V45ZM15 45H25.5V7.5H15V45ZM30 45H40.5V0H30V45Z" fill="black"/>
      </svg>
    </div>
  </div>

  <!-- Navigation Links (Figma Icons) -->
  <nav class="flex flex-col gap-8 w-full flex-1 items-center overflow-hidden">
    
    <!-- Home Icon -->
    <a routerLink="/dashboard" routerLinkActive="active-link" title="Inicio"
       [style.color]="themeService.currentTheme().atmosphere.text"
       class="w-full h-8 flex items-center justify-center opacity-40 hover:opacity-100 transition-all duration-200 cursor-pointer group relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
      <div class="active-indicator absolute left-0 top-1/2 -translate-y-1/2 w-[2px] h-4 bg-black rounded-r-full scale-y-0 transition-transform duration-300" [style.backgroundColor]="themeService.currentTheme().primaryColor"></div>
    </a>

    <!-- User Icon -->
    <a routerLink="/clients" routerLinkActive="active-link" title="Clientes"
       [style.color]="themeService.currentTheme().atmosphere.text"
       class="w-full h-8 flex items-center justify-center opacity-40 hover:opacity-100 transition-all duration-200 cursor-pointer group relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <div class="active-indicator absolute left-0 top-1/2 -translate-y-1/2 w-[2px] h-4 bg-black rounded-r-full scale-y-0 transition-transform duration-300" [style.backgroundColor]="themeService.currentTheme().primaryColor"></div>
    </a>

    <!-- Modules Icon (4 squares with plus) -->
    @for (mod of [1,2,3]; track mod) {
      <a [routerLink]="mod === 1 ? '/delivery-notes' : mod === 2 ? '/budgets' : '/stock'" 
         routerLinkActive="active-link" 
         [title]="mod === 1 ? 'Albaranes' : mod === 2 ? 'Presupuestos' : 'Stock'"
         [style.color]="themeService.currentTheme().atmosphere.text"
         class="w-full h-8 flex items-center justify-center opacity-40 hover:opacity-100 transition-all duration-200 cursor-pointer group relative">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
          <path d="M10 17.5h7.5M13.75 13.75V21.25" stroke-width="1.2"></path>
        </svg>
        <div class="active-indicator absolute left-0 top-1/2 -translate-y-1/2 w-[2px] h-4 bg-black rounded-r-full scale-y-0 transition-transform duration-300" [style.backgroundColor]="themeService.currentTheme().primaryColor"></div>
      </a>
    }
  </nav>

  <!-- Bottom Section -->
  <div class="flex flex-col items-center gap-8 w-full py-8 border-t border-slate-50">
    
    <!-- Theme Toggle (Sparkle Icon) -->
    <button 
      (click)="openThemeSettings()"
      title="Personalizar"
      [style.color]="themeService.currentTheme().atmosphere.text"
      class="opacity-40 hover:opacity-100 transition-all duration-200 cursor-pointer"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.91 5.89L21 10.8l-5.89 1.91L13.2 21l-1.91-5.89L3 13.2l5.89-1.91L10.8 3z"></path>
      </svg>
    </button>

    <!-- Settings Icon -->
    <a routerLink="/settings" title="Ajustes" [style.color]="themeService.currentTheme().atmosphere.text"
       class="opacity-40 hover:opacity-100 transition-all duration-200">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </a>

    <!-- Logout Icon -->
    <div title="Cerrar sesión" class="opacity-40 hover:opacity-100 transition-all duration-200 cursor-pointer" [style.color]="themeService.currentTheme().atmosphere.text">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </div>
  </div>
</div>

@if (showThemeModal()) {
  <josanz-theme-modal (modalClose)="closeThemeSettings()"></josanz-theme-modal>
}
