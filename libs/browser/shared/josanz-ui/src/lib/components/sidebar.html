<aside 
  [class.w-[37px]]="!isOpen" 
  [class.w-64]="isOpen" 
  class="h-screen bg-white flex flex-col items-center py-4 shadow-[0px_12px_24px_#EAEAEA] border-r border-[#F0F0F0] sticky top-0 transition-all duration-300 overflow-hidden z-50">
  
  <!-- Logo Section (Minimalist) -->
  <div class="mb-12 shrink-0 flex items-center justify-center w-full">
    <div 
      [class.w-6]="!isOpen" [class.h-6]="!isOpen"
      [class.w-10]="isOpen" [class.h-10]="isOpen"
      class="bg-black rounded-md flex items-center justify-center transition-all duration-300">
      <svg [attr.width]="isOpen ? '20' : '14'" [attr.height]="isOpen ? '20' : '14'" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 6H12V26H6V6Z" fill="white"/>
        <path d="M14 6H20V20H14V6Z" fill="white"/>
        <path d="M22 6H26V14H22V6Z" fill="white"/>
      </svg>
    </div>
  </div>

  <!-- Navigation Items -->
  <nav class="flex-1 flex flex-col items-center gap-6 w-full px-1">
    <a routerLink="/dashboard" routerLinkActive="text-black" 
       class="w-full h-8 flex items-center justify-center text-[#94A3B8] hover:text-black transition-all duration-200 cursor-pointer group">
      <div class="w-full flex items-center justify-center shrink-0">
        <svg [attr.width]="isOpen ? '20' : '18'" [attr.height]="isOpen ? '20' : '18'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      @if (isOpen) {
        <span class="ml-3 text-[14px] font-semibold flex-1 truncate">Dashboard</span>
      }
    </a>

    <a routerLink="/users" routerLinkActive="text-black" 
       class="w-full h-8 flex items-center justify-center text-[#94A3B8] hover:text-black transition-all duration-200 cursor-pointer group">
      <div class="w-full flex items-center justify-center shrink-0">
        <svg [attr.width]="isOpen ? '20' : '18'" [attr.height]="isOpen ? '20' : '18'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      @if (isOpen) {
        <span class="ml-3 text-[14px] font-semibold flex-1 truncate">Usuarios</span>
      }
    </a>

    <a routerLink="/clients" routerLinkActive="text-black" 
       class="w-full h-8 flex items-center justify-center text-[#94A3B8] hover:text-black transition-all duration-200 cursor-pointer group">
      <div class="w-full flex items-center justify-center shrink-0">
        <svg [attr.width]="isOpen ? '20' : '18'" [attr.height]="isOpen ? '20' : '18'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      </div>
      @if (isOpen) {
        <span class="ml-3 text-[14px] font-semibold flex-1 truncate">Clientes</span>
      }
    </a>

    <a routerLink="/stock" routerLinkActive="text-black" 
       class="w-full h-8 flex items-center justify-center text-[#94A3B8] hover:text-black transition-all duration-200 cursor-pointer group">
      <div class="w-full flex items-center justify-center shrink-0">
        <svg [attr.width]="isOpen ? '20' : '18'" [attr.height]="isOpen ? '20' : '18'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
      </div>
      @if (isOpen) {
        <span class="ml-3 text-[14px] font-semibold flex-1 truncate">Stock</span>
      }
    </a>

    <a routerLink="/budgets" routerLinkActive="text-black" 
       class="w-full h-8 flex items-center justify-center text-[#94A3B8] hover:text-black transition-all duration-200 cursor-pointer group">
      <div class="w-full flex items-center justify-center shrink-0">
        <svg [attr.width]="isOpen ? '20' : '18'" [attr.height]="isOpen ? '20' : '18'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      </div>
      @if (isOpen) {
        <span class="ml-3 text-[14px] font-semibold flex-1 truncate">Presupuestos</span>
      }
    </a>

    <a routerLink="/delivery-notes" routerLinkActive="text-black" 
       class="w-full h-8 flex items-center justify-center text-[#94A3B8] hover:text-black transition-all duration-200 cursor-pointer group">
      <div class="w-full flex items-center justify-center shrink-0">
        <svg [attr.width]="isOpen ? '20' : '18'" [attr.height]="isOpen ? '20' : '18'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v3m18 0h-4.5a2.5 2.5 0 1 0 0 5H21v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3h4.5a2.5 2.5 0 1 0 0-5H3V8m18 0V8m-18 0V8"/></svg>
      </div>
      @if (isOpen) {
        <span class="ml-3 text-[14px] font-semibold flex-1 truncate">Albaranes</span>
      }
    </a>
  </nav>

  <!-- Bottom Section -->
  <div class="mt-auto flex flex-col items-center gap-6 w-full px-1 pb-8">
    <a routerLink="/settings" routerLinkActive="text-black" 
       class="w-full h-8 flex items-center justify-center text-[#94A3B8] hover:text-black transition-all duration-200 cursor-pointer group">
      <div class="w-full flex items-center justify-center shrink-0">
        <svg [attr.width]="isOpen ? '20' : '18'" [attr.height]="isOpen ? '20' : '18'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </div>
      @if (isOpen) {
        <span class="ml-3 text-[14px] font-semibold flex-1 truncate">Ajustes</span>
      }
    </a>

    <a routerLink="/auth" class="w-full h-8 flex items-center justify-center text-[#94A3B8] hover:text-red-600 transition-all duration-200 cursor-pointer group">
      <div class="w-full flex items-center justify-center shrink-0">
        <svg [attr.width]="isOpen ? '20' : '18'" [attr.height]="isOpen ? '20' : '18'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      </div>
      @if (isOpen) {
        <span class="ml-3 text-[14px] font-semibold flex-1 truncate">Salir</span>
      }
    </a>
  </div>
</aside>
