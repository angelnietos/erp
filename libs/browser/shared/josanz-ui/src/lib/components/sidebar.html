<aside
  class="josanz-sidebar"
  [class.josanz-sidebar--open]="isOpen"
  [style.width]="isOpen ? 'var(--josanz-sidebar-expanded-width)' : 'var(--josanz-sidebar-width)'"
>
  <div class="josanz-sidebar__logo" aria-label="Josanz">
    <img src="/logo.png" alt="Josanz Logo" />
  </div>

  <button
    type="button"
    class="josanz-sidebar__toggle"
    [attr.aria-label]="isOpen ? 'Contraer menú' : 'Expandir menú'"
    [attr.aria-expanded]="isOpen"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      @if (isOpen) {
        <path d="M15 18l-6-6 6-6" />
      } @else {
        <path d="M9 18l6-6-6-6" />
      }
    </svg>
  </button>

  <nav class="josanz-sidebar__nav" aria-label="Navegación principal">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active-link"
        [title]="item.label"
        class="josanz-sidebar__item group"
      >
        <span class="nav-icon-container" aria-hidden="true">
          @switch (item.icon) {
            @case ('home') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 11.5 12 3l9 8.5" />
                <path d="M5.5 10.5V21h13V10.5" />
                <path d="M9.5 21v-6h5v6" />
              </svg>
            }
            @case ('events') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.5" y="5.5" width="17" height="15" rx="2" />
                <path d="M7.5 3.5v4M16.5 3.5v4M3.5 9.5h17" />
                <path d="m12 12.2 1.15 2.25 2.5.35-1.82 1.74.43 2.46L12 17.84 9.74 19l.43-2.46-1.82-1.74 2.5-.35L12 12.2z" />
              </svg>
            }
            @case ('clients') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="10" cy="7.5" r="3.2" />
                <path d="M4.5 20c.45-4.1 2.3-6 5.5-6 1.5 0 2.7.42 3.6 1.28" />
                <path d="M18.5 13v7M15 16.5h7" />
              </svg>
            }
            @case ('mic') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="3" width="6" height="12" rx="3" />
                <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7" />
              </svg>
            }
            @case ('truck') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7.5h11v9H3z" />
                <path d="M14 10h4l3 3.2v3.3h-7" />
                <path d="M6.5 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM17.5 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" />
              </svg>
            }
            @case ('staff') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8" cy="8" r="3" />
                <circle cx="16" cy="8" r="3" />
                <path d="M2.5 19c.4-3.3 2.1-5 5.5-5s5.1 1.7 5.5 5" />
                <path d="M10.5 19c.45-3.3 2.15-5 5.5-5 3.4 0 5.1 1.7 5.5 5" />
              </svg>
            }
            @case ('billing') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="3" width="14" height="18" rx="2" />
                <path d="M14.5 8.5a4 4 0 1 0 0 7M9 11.5h5M9 13.5h5" />
              </svg>
            }
          }
        </span>
        <span class="josanz-sidebar__label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="josanz-sidebar__bottom">
    <a routerLink="/settings" routerLinkActive="active-link" title="Ajustes" class="josanz-sidebar__item group">
      <span class="nav-icon-container" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V22h-4v-.49a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H2v-4h1.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 8.92 4a1.65 1.65 0 0 0 1-1.51V2h4v.49a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.24.58.78 1 1.51 1H22v4h-1.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </span>
      <span class="josanz-sidebar__label">Ajustes</span>
    </a>

    <button type="button" title="Salir" class="josanz-sidebar__item josanz-sidebar__button" (click)="onLogoutClick()">
      <span class="nav-icon-container" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 8a5 5 0 1 1 0 8" />
          <path d="M15 12H3" />
          <path d="m6 9-3 3 3 3" />
        </svg>
      </span>
      <span class="josanz-sidebar__label">Salir</span>
    </button>
  </div>
</aside>
