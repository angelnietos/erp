<aside 
  [class.w-20]="!isOpen" 
  [class.w-64]="isOpen" 
  class="h-screen bg-white flex flex-col items-center py-6 shadow-[4px_0px_24px_rgba(0,0,0,0.02)] border-r border-[#F0F0F0] sticky top-0 transition-all duration-300 overflow-hidden z-50">
  
  <!-- Toggle Button (Figma Style) -->
  <button 
    (click)="toggle()"
    class="absolute -right-0 top-10 bg-white border border-[#F0F0F0] rounded-l-md p-1 shadow-sm hover:bg-slate-50 transition-colors z-50">
    <svg 
      [class.rotate-180]="isOpen"
      class="transition-transform duration-300 text-slate-400"
      width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <!-- Logo Section -->
  <div class="mb-12 shrink-0 flex items-center justify-center w-full px-4">
    <div 
      [class.w-10]="!isOpen" [class.h-10]="!isOpen"
      [class.w-12]="isOpen" [class.h-12]="isOpen"
      class="bg-black rounded-xl flex items-center justify-center transition-all duration-300">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 6H12V26H6V6Z" fill="white"/>
        <path d="M14 6H20V20H14V6Z" fill="white"/>
        <path d="M22 6H26V14H22V6Z" fill="white"/>
      </svg>
    </div>
  </div>

  <!-- Navigation Items -->
  <nav class="flex-1 flex flex-col items-center gap-4 w-full px-3">
    <a routerLink="/dashboard" routerLinkActive="bg-[#F8FAFC] text-black shadow-sm" 
       class="w-full h-12 rounded-xl flex items-center justify-center text-[#94A3B8] hover:bg-slate-50 hover:text-black transition-all duration-200 cursor-pointer group">
      <div class="w-10 h-10 flex items-center justify-center shrink-0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <span *ngIf="isOpen" class="ml-2 text-[14px] font-semibold flex-1 truncate transition-opacity duration-300">Dashboard</span>
    </a>

    <a routerLink="/users" routerLinkActive="bg-[#F8FAFC] text-black shadow-sm" 
       class="w-full h-12 rounded-xl flex items-center justify-center text-[#94A3B8] hover:bg-slate-50 hover:text-black transition-all duration-200 cursor-pointer group">
      <div class="w-10 h-10 flex items-center justify-center shrink-0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <span *ngIf="isOpen" class="ml-2 text-[14px] font-semibold flex-1 truncate transition-opacity duration-300">Usuarios</span>
    </a>

    <a routerLink="/clients" routerLinkActive="bg-[#F8FAFC] text-black shadow-sm" 
       class="w-full h-12 rounded-xl flex items-center justify-center text-[#94A3B8] hover:bg-slate-50 hover:text-black transition-all duration-200 cursor-pointer group">
      <div class="w-10 h-10 flex items-center justify-center shrink-0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      </div>
      <span *ngIf="isOpen" class="ml-2 text-[14px] font-semibold flex-1 truncate transition-opacity duration-300">Clientes</span>
    </a>

    <a routerLink="/stock" routerLinkActive="bg-[#F8FAFC] text-black shadow-sm" 
       class="w-full h-12 rounded-xl flex items-center justify-center text-[#94A3B8] hover:bg-slate-50 hover:text-black transition-all duration-200 cursor-pointer group">
      <div class="w-10 h-10 flex items-center justify-center shrink-0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
      </div>
      <span *ngIf="isOpen" class="ml-2 text-[14px] font-semibold flex-1 truncate transition-opacity duration-300">Stock</span>
    </a>
  </nav>

  <!-- Bottom Section -->
  <div class="mt-auto flex flex-col items-center gap-2 w-full px-3 pb-6">
    <div *ngIf="isOpen" class="w-full mb-4 px-1">
      <div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 border border-slate-100">
        <div class="w-9 h-9 rounded-xl bg-black text-white flex items-center justify-center text-xs font-bold shadow-sm">{{userName[0]}}</div>
        <div class="flex-1 truncate">
          <p class="text-[12px] font-bold text-black truncate">{{userName}}</p>
          <p class="text-[10px] font-medium text-slate-500 truncate">{{userRole}}</p>
        </div>
      </div>
    </div>

    <a routerLink="/settings" routerLinkActive="bg-[#F8FAFC] text-black shadow-sm" 
       class="w-full h-12 rounded-xl flex items-center justify-center text-[#94A3B8] hover:bg-slate-50 hover:text-black transition-all duration-200 cursor-pointer group">
      <div class="w-10 h-10 flex items-center justify-center shrink-0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </div>
      <span *ngIf="isOpen" class="ml-2 text-[14px] font-semibold flex-1 truncate transition-opacity duration-300">Ajustes</span>
    </a>

    <a routerLink="/auth" class="w-full h-12 rounded-xl flex items-center justify-center text-[#94A3B8] hover:bg-red-50 hover:text-red-600 transition-all duration-200 cursor-pointer group">
      <div class="w-10 h-10 flex items-center justify-center shrink-0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      </div>
      <span *ngIf="isOpen" class="ml-2 text-[14px] font-semibold flex-1 truncate transition-opacity duration-300">Cerrar Sesión</span>
    </a>
  </div>
</aside>
