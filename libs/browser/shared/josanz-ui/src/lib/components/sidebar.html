<aside [class.w-16]="!isOpen" [class.w-64]="isOpen" class="h-screen bg-white flex flex-col items-center py-6 shadow-[0px_12px_24px_0px_rgba(234,234,234,0.5)] border-r border-[#F0F0F0] sticky top-0 transition-all duration-300 overflow-hidden">
  <!-- Logo Section -->
  <div class="mb-10 px-1 shrink-0">
    <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center shadow-lg shadow-black/10">
      <span class="text-white text-[10px] font-black tracking-tighter">JZ</span>
    </div>
  </div>

  <!-- Navigation Items -->
  <nav class="flex-1 flex flex-col items-center gap-6 w-full px-3">
    <a routerLink="/dashboard" routerLinkActive="bg-blue-50 text-blue-600 shadow-sm shadow-blue-100/50" 
       class="w-full h-10 rounded-xl flex items-center justify-center text-[#4A5568] hover:bg-slate-50 hover:text-blue-600 transition-all duration-200 cursor-pointer group relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span *ngIf="isOpen" class="ml-3 text-sm font-semibold flex-1 truncate transition-opacity duration-300">Dashboard</span>
    </a>

    <a routerLink="/users" routerLinkActive="bg-blue-50 text-blue-600 shadow-sm shadow-blue-100/50" 
       class="w-full h-10 rounded-xl flex items-center justify-center text-[#4A5568] hover:bg-slate-50 hover:text-blue-600 transition-all duration-200 cursor-pointer group relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span *ngIf="isOpen" class="ml-3 text-sm font-semibold flex-1 truncate transition-opacity duration-300">Usuarios</span>
    </a>

    <a routerLink="/clients" routerLinkActive="bg-blue-50 text-blue-600 shadow-sm shadow-blue-100/50" 
       class="w-full h-10 rounded-xl flex items-center justify-center text-[#4A5568] hover:bg-slate-50 hover:text-blue-600 transition-all duration-200 cursor-pointer group relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      <span *ngIf="isOpen" class="ml-3 text-sm font-semibold flex-1 truncate transition-opacity duration-300">Clientes</span>
    </a>

    <a routerLink="/stock" routerLinkActive="bg-blue-50 text-blue-600 shadow-sm shadow-blue-100/50" 
       class="w-full h-10 rounded-xl flex items-center justify-center text-[#4A5568] hover:bg-slate-50 hover:text-blue-600 transition-all duration-200 cursor-pointer group relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
      <span *ngIf="isOpen" class="ml-3 text-sm font-semibold flex-1 truncate transition-opacity duration-300">Stock</span>
    </a>
  </nav>

  <!-- Bottom Section -->
  <div class="mt-auto flex flex-col items-center gap-4 w-full px-3 pb-6 border-t border-slate-50 pt-6">
    <div *ngIf="isOpen" class="w-full mb-2 px-1">
      <div class="flex items-center gap-3 p-2 rounded-2xl bg-slate-50 border border-slate-100">
        <div class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xs font-bold">{{userName[0]}}</div>
        <div class="flex-1 truncate">
          <p class="text-[11px] font-black text-slate-900 truncate">{{userName}}</p>
          <p class="text-[9px] font-medium text-slate-500 truncate">{{userRole}}</p>
        </div>
      </div>
    </div>

    <a routerLink="/settings" routerLinkActive="bg-blue-50 text-blue-600 shadow-sm shadow-blue-100/50" 
       class="w-full h-10 rounded-xl flex items-center justify-center text-[#4A5568] hover:bg-slate-50 hover:text-blue-600 transition-all duration-200 cursor-pointer group">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      <span *ngIf="isOpen" class="ml-3 text-sm font-semibold flex-1 truncate transition-opacity duration-300">Ajustes</span>
    </a>

    <a routerLink="/auth" class="w-full h-10 rounded-xl flex items-center justify-center text-[#4A5568] hover:bg-red-50 hover:text-red-600 transition-all duration-200 cursor-pointer group">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      <span *ngIf="isOpen" class="ml-3 text-sm font-semibold flex-1 truncate transition-opacity duration-300">Cerrar Sesión</span>
    </a>
  </div>
</aside>
