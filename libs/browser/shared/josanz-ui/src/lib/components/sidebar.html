<aside
  class="josanz-sidebar"
  [class.josanz-sidebar--open]="isOpen"
  [style.width]="isOpen ? 'var(--josanz-sidebar-expanded-width)' : 'var(--josanz-sidebar-width)'"
>
  <div class="josanz-sidebar__logo" aria-label="Josanz">
    <img [src]="logoSrc" alt="Josanz Logo" />
  </div>

  <button
    type="button"
    class="josanz-sidebar__toggle"
    [attr.aria-label]="isOpen ? 'Contraer menú' : 'Expandir menú'"
    [attr.aria-expanded]="isOpen"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      @if (isOpen) {
        <path d="M15 18l-6-6 6-6" />
      } @else {
        <path d="M9 18l6-6-6-6" />
      }
    </svg>
  </button>

  <nav class="josanz-sidebar__nav" aria-label="Navegación principal">
    @for (item of filteredNavItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
        [title]="item.label"
        class="josanz-sidebar__item group"
      >
        <span class="nav-icon-container" aria-hidden="true">
          <josanz-sidebar-icon [icon]="item.icon" />
        </span>
        <span class="josanz-sidebar__label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="josanz-sidebar__bottom">
    @if (canAccessSettings()) {
    <a routerLink="/settings" routerLinkActive="active-link" title="Ajustes" class="josanz-sidebar__item group">
      <span class="nav-icon-container" aria-hidden="true">
        <josanz-sidebar-icon icon="ajustes" />
      </span>
      <span class="josanz-sidebar__label">Ajustes</span>
    </a>
    }

    <button
      type="button"
      title="Salir"
      aria-label="Salir"
      class="josanz-sidebar__item josanz-sidebar__button"
      (click)="onLogoutClick()"
    >
      <span class="nav-icon-container" aria-hidden="true">
        <josanz-sidebar-icon icon="salir" />
      </span>
      <span class="josanz-sidebar__label">Salir</span>
    </button>
  </div>
</aside>
