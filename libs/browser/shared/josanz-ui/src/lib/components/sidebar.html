<div class="h-screen flex flex-col items-center py-12 transition-all duration-300 relative z-[100] w-[44px] border-r"
     [style.backgroundColor]="themeService.currentTheme().atmosphere.surface"
     [style.borderColor]="themeService.currentTheme().atmosphere.border">

  <!-- Logo Section -->
  <div class="mb-14 flex items-center justify-center w-full">
    <div class="w-7 h-7 flex items-center justify-center cursor-pointer overflow-hidden">
      <svg width="26" height="26" viewBox="0 0 41 45" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 45H10.5V14.5H0V45ZM15 45H25.5V7.5H15V45ZM30 45H40.5V0H30V45Z" fill="black"/>
      </svg>
    </div>
  </div>

  <!-- Navigation Links -->
  <nav class="flex flex-col gap-10 w-full flex-1 items-center overflow-hidden">
    
    <!-- Home (Precise Figma) -->
    <a routerLink="/dashboard" routerLinkActive="active-link" title="Inicio"
       class="w-full h-6 flex items-center justify-center transition-all duration-200 cursor-pointer group relative"
       [style.color]="themeService.currentTheme().atmosphere.text"
       style="opacity: 0.8;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
      <div class="active-indicator absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-5 rounded-r-full scale-y-0 transition-transform duration-300" [style.backgroundColor]="themeService.currentTheme().primaryColor"></div>
    </a>

    <!-- User (Precise Figma) -->
    <a routerLink="/clients" routerLinkActive="active-link" title="Clientes"
       class="w-full h-6 flex items-center justify-center transition-all duration-200 cursor-pointer group relative"
       [style.color]="themeService.currentTheme().atmosphere.text"
       style="opacity: 0.8;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <div class="active-indicator absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-5 rounded-r-full scale-y-0 transition-transform duration-300" [style.backgroundColor]="themeService.currentTheme().primaryColor"></div>
    </a>

    <!-- Grid Modules + (Precise Figma) -->
    @for (link of [
      {path: '/delivery-notes', label: 'Albaranes'},
      {path: '/budgets', label: 'Presupuestos'},
      {path: '/stock', label: 'Stock'}
    ]; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active-link" [title]="link.label"
         class="w-full h-6 flex items-center justify-center transition-all duration-200 cursor-pointer group relative"
         [style.color]="themeService.currentTheme().atmosphere.text"
         style="opacity: 0.8;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <!-- 4 Rects -->
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <!-- Plus Sign at bottom right -->
          <path d="M14 17h6M17 14v6" stroke-width="2" />
        </svg>
        <div class="active-indicator absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-5 rounded-r-full scale-y-0 transition-transform duration-300" [style.backgroundColor]="themeService.currentTheme().primaryColor"></div>
      </a>
    }

    <!-- Sparkle Theme (Precise Figma) -->
    <button (click)="openThemeSettings()" title="Personalizar"
       class="w-full h-6 flex items-center justify-center transition-all duration-200 cursor-pointer group"
       [style.color]="themeService.currentTheme().atmosphere.text"
       style="opacity: 0.8;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.5 5.5l5.5 1.5l-5.5 1.5l-1.5 5.5l-1.5-5.5l-5.5-1.5l5.5-1.5z"></path>
        <circle cx="19" cy="6" r="0.5" fill="currentColor"></circle>
        <circle cx="6" cy="18" r="0.5" fill="currentColor"></circle>
      </svg>
    </button>

  </nav>

  <!-- Bottom Section -->
  <div class="flex flex-col items-center gap-10 w-full py-12 border-t" [style.borderColor]="themeService.currentTheme().atmosphere.border">
    
    <!-- Settings -->
    <a routerLink="/settings" title="Ajustes" 
       class="transition-all duration-200 cursor-pointer"
       [style.color]="themeService.currentTheme().atmosphere.text"
       style="opacity: 0.8;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </a>

    <!-- Logout -->
    <div title="Cerrar sesión" class="transition-all duration-200 cursor-pointer"
         [style.color]="themeService.currentTheme().atmosphere.text"
         style="opacity: 0.8;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </div>
  </div>
</div>

@if (showThemeModal()) {
  <josanz-theme-modal (modalClose)="closeThemeSettings()"></josanz-theme-modal>
}
