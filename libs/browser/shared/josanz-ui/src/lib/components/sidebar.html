<div class="h-screen border-r flex flex-col items-center py-6 transition-all duration-300 relative shadow-sm"
     [style.backgroundColor]="themeService.currentTheme().atmosphere.surface"
     [style.borderColor]="themeService.currentTheme().atmosphere.border"
     [class.w-[256px]]="isOpen"
     [class.w-[64px]]="!isOpen">

  <!-- Toggle Button -->
  <button 
    (click)="toggle()"
    class="absolute -right-3 top-12 w-6 h-6 bg-white border border-slate-200 rounded-full flex items-center justify-center shadow-sm hover:bg-slate-50 transition-all z-50 cursor-pointer text-slate-400 hover:text-slate-900"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
         [class.rotate-180]="isOpen">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <!-- Logo Section -->
  <div class="mb-10 flex items-center w-full px-4 overflow-hidden">
    <div class="w-8 h-8 bg-black rounded-[8px] flex items-center justify-center shrink-0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </div>
    @if (isOpen) {
      <span class="ml-3 text-[18px] font-bold whitespace-nowrap" [style.color]="themeService.currentTheme().atmosphere.text">Josanz ERP</span>
    }
  </div>

  <!-- Navigation Links -->
  <nav class="flex flex-col gap-1 w-full px-2 flex-1 overflow-hidden">
    
    <a routerLink="/clients" routerLinkActive="bg-slate-50/20 shadow-sm" [style.color]="themeService.currentTheme().atmosphere.text"
       class="w-full h-11 flex items-center px-3 rounded-[10px] opacity-70 hover:opacity-100 transition-all duration-200 cursor-pointer group">
      <div class="w-6 h-6 flex items-center justify-center shrink-0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
        </svg>
      </div>
      @if (isOpen) { <span class="ml-3 text-[14px] font-semibold whitespace-nowrap">Clientes</span> }
    </a>

    <a routerLink="/delivery-notes" routerLinkActive="bg-slate-50/20 shadow-sm" [style.color]="themeService.currentTheme().atmosphere.text"
       class="w-full h-11 flex items-center px-3 rounded-[10px] opacity-70 hover:opacity-100 transition-all duration-200 cursor-pointer group">
      <div class="w-6 h-6 flex items-center justify-center shrink-0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
      </div>
      @if (isOpen) { <span class="ml-3 text-[14px] font-semibold whitespace-nowrap">Albaranes</span> }
    </a>

    <a routerLink="/budgets" routerLinkActive="bg-slate-50/20 shadow-sm" [style.color]="themeService.currentTheme().atmosphere.text"
       class="w-full h-11 flex items-center px-3 rounded-[10px] opacity-70 hover:opacity-100 transition-all duration-200 cursor-pointer group">
      <div class="w-6 h-6 flex items-center justify-center shrink-0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
        </svg>
      </div>
      @if (isOpen) { <span class="ml-3 text-[14px] font-semibold whitespace-nowrap">Presupuestos</span> }
    </a>

    <a routerLink="/stock" routerLinkActive="bg-slate-50/20 shadow-sm" [style.color]="themeService.currentTheme().atmosphere.text"
       class="w-full h-11 flex items-center px-3 rounded-[10px] opacity-70 hover:opacity-100 transition-all duration-200 cursor-pointer group">
      <div class="w-6 h-6 flex items-center justify-center shrink-0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        </svg>
      </div>
      @if (isOpen) { <span class="ml-3 text-[14px] font-semibold whitespace-nowrap">Stock</span> }
    </a>
  </nav>

  <!-- Customization Button (Trigger Modal) -->
  <div class="px-2 py-4 w-full flex justify-center border-t" [style.borderColor]="themeService.currentTheme().atmosphere.border">
    <button 
      (click)="openThemeSettings()"
      class="w-10 h-10 rounded-xl flex items-center justify-center transition-all hover:scale-110 active:scale-95 shadow-sm group relative"
      [style.backgroundColor]="themeService.currentTheme().primaryColor"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path>
      </svg>
      @if (isOpen) {
        <span class="absolute left-14 bg-black text-white text-[10px] font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
          Personalizar Interfaz
        </span>
      }
    </button>
  </div>

  <!-- Bottom Section -->
  <div class="flex flex-col items-center gap-2 w-full px-1 py-4 border-t" [style.borderColor]="themeService.currentTheme().atmosphere.border">
    <a routerLink="/settings" class="w-10 h-11 flex items-center px-3 rounded-[10px] text-[#94A3B8] hover:bg-slate-50/10 transition-all duration-200 cursor-pointer group">
      <div class="w-6 h-6 flex items-center justify-center shrink-0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </div>
      @if (isOpen) { <span class="ml-3 text-[14px] font-semibold whitespace-nowrap">Ajustes</span> }
    </a>

    <div class="w-10 h-11 flex items-center px-3 rounded-[10px] text-red-400 hover:bg-red-50/10 hover:text-red-600 transition-all duration-200 cursor-pointer group">
      <div class="w-6 h-6 flex items-center justify-center shrink-0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </div>
      @if (isOpen) { <span class="ml-3 text-[14px] font-semibold whitespace-nowrap">Cerrar sesión</span> }
    </div>
  </div>
</div>

@if (showThemeModal()) {
  <josanz-theme-modal (modalClose)="closeThemeSettings()"></josanz-theme-modal>
}
