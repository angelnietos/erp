<div class="flex min-w-0 items-center gap-3 overflow-x-auto no-scrollbar pb-1 -mb-1 w-full">
  @for (option of options; track option) {
    <button
      type="button"
      (click)="selectOption(option)"
      [class]="buttonClass(option)"
      [ngStyle]="pillStyles(option)"
    >
      {{ option }}
    </button>
  }
</div>
