<div [class]="containerClass()">
  @for (option of options; track option) {
    <button
      type="button"
      (click)="selectOption(option)"
      [class]="buttonClass(option)"
      [ngStyle]="pillStyles(option)"
    >
      {{ option }}
      @if (showUnderline(option)) {
        <span
          class="absolute bottom-0 left-0 right-0 h-[3px] rounded-full bg-[var(--josanz-interactive)]"
          aria-hidden="true"
        ></span>
      }
    </button>
  }
</div>
