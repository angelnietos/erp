<nav
  *ngIf="total > 0"
  class="josanz-pagination flex flex-wrap items-center justify-center gap-1 sm:gap-2"
  [style.--josanz-primary]="customColor || null"
  aria-label="Paginación"
>
  <button
    type="button"
    class="josanz-pagination__nav min-h-9 min-w-9 border border-slate-200 bg-white px-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40"
    [ngClass]="cornerClass()"
    (click)="prev()"
    [disabled]="effectiveCurrent <= 1"
    aria-label="Página anterior"
  >
    ‹
  </button>

  <ol class="flex list-none flex-wrap items-center justify-center gap-1 p-0 m-0">
    <li *ngFor="let item of pageItems(); trackBy: trackPageItem">
      <span
        *ngIf="item === 'ellipsis'"
        class="josanz-pagination__ellipsis px-2 text-sm font-medium text-slate-400 select-none"
        aria-hidden="true"
        >…</span
      >
      <button
        *ngIf="item !== 'ellipsis'"
        type="button"
        class="josanz-pagination__page min-h-9 min-w-9 border text-sm font-semibold transition"
        [ngClass]="
          [
            cornerClass(),
            item === effectiveCurrent
              ? 'border-[var(--josanz-primary,#4f46e5)] bg-[var(--josanz-primary,#4f46e5)] text-white shadow-sm'
              : 'border-slate-200 bg-white text-slate-700 shadow-sm hover:bg-slate-50'
          ]
        "
        [attr.aria-current]="item === effectiveCurrent ? 'page' : null"
        (click)="go(item)"
      >
        {{ item }}
      </button>
    </li>
  </ol>

  <button
    type="button"
    class="josanz-pagination__nav min-h-9 min-w-9 border border-slate-200 bg-white px-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40"
    [ngClass]="cornerClass()"
    (click)="next()"
    [disabled]="effectiveCurrent >= total"
    aria-label="Página siguiente"
  >
    ›
  </button>
</nav>
