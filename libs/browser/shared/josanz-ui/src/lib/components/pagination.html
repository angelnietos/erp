<nav
  *ngIf="total > 0"
  class="josanz-pagination flex flex-wrap items-center justify-center gap-1 sm:gap-2"
  [style.--josanz-primary]="customColor || null"
  aria-label="Paginación"
>
  <button
    type="button"
    class="josanz-pagination__nav min-h-9 min-w-9 border border-solid px-2 text-sm font-semibold shadow-sm transition hover:brightness-[0.97] disabled:cursor-not-allowed disabled:opacity-40"
    [ngClass]="cornerClass()"
    [ngStyle]="surfaceNavStyle()"
    (click)="prev()"
    [disabled]="effectiveCurrent <= 1"
    aria-label="Página anterior"
  >
    ‹
  </button>

  <ol class="flex list-none flex-wrap items-center justify-center gap-1 p-0 m-0">
    <li *ngFor="let item of pageItems(); trackBy: trackPageItem">
      <span
        *ngIf="item === 'ellipsis'"
        class="josanz-pagination__ellipsis px-2 text-sm font-medium select-none"
        [style.color]="themeService.currentTheme().atmosphere.textMuted"
        aria-hidden="true"
        >…</span
      >
      <button
        *ngIf="item !== 'ellipsis'"
        type="button"
        class="josanz-pagination__page min-h-9 min-w-9 border border-solid text-sm font-semibold transition shadow-sm hover:brightness-[0.97]"
        [ngClass]="cornerClass()"
        [ngStyle]="pageButtonStyle(item === effectiveCurrent)"
        [attr.aria-current]="item === effectiveCurrent ? 'page' : null"
        (click)="go(item)"
      >
        {{ item }}
      </button>
    </li>
  </ol>

  <button
    type="button"
    class="josanz-pagination__nav min-h-9 min-w-9 border border-solid px-2 text-sm font-semibold shadow-sm transition hover:brightness-[0.97] disabled:cursor-not-allowed disabled:opacity-40"
    [ngClass]="cornerClass()"
    [ngStyle]="surfaceNavStyle()"
    (click)="next()"
    [disabled]="effectiveCurrent >= total"
    aria-label="Página siguiente"
  >
    ›
  </button>
</nav>
