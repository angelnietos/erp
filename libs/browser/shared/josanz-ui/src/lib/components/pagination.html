<div
  class="bg-blue-50 rounded-full flex items-center justify-center transition-all duration-300 group overflow-hidden border-slate-200"
  [ngClass]="
    size === 'lg'
      ? 'w-16 h-16 min-w-[64px] min-h-[64px] border-2 shadow-inner'
      : 'w-10 h-10 cursor-pointer hover:shadow-md active:scale-95 border'
  "
>
  <svg
    [attr.width]="size === 'lg' ? 32 : 20"
    [attr.height]="size === 'lg' ? 32 : 20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="text-blue-500 transition-colors group-hover:text-blue-600"
  >
    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
    <circle cx="12" cy="7" r="4" />
  </svg>
</div>
