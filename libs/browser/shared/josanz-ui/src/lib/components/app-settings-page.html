<div class="josanz-app-settings mx-auto flex w-full max-w-5xl flex-col gap-6 pb-8">
  <header class="josanz-app-settings__header">
    <h1 class="josanz-app-settings__title">Ajustes</h1>
    <div class="josanz-app-settings__accent" aria-hidden="true"></div>
  </header>

  <josanz-main-tabs
    [options]="tabOptions"
    [selection]="activeTab()"
    (selectionChange)="onTabChange($event)"
  ></josanz-main-tabs>

  @if (activeTab() === 'General') {
    <section class="josanz-app-settings__panel">
      <h2 class="text-[18px] font-bold mb-2" [style.color]="themeService.currentTheme().atmosphere.text">
        Cuenta y aplicación
      </h2>
      <p class="text-[14px] leading-relaxed mb-6" [style.color]="themeService.currentTheme().atmosphere.textMuted">
        Preferencias de cuenta, notificaciones e integraciones estarán disponibles próximamente.
      </p>
      <a
        routerLink="/dashboard"
        class="inline-flex rounded-xl px-4 py-2 text-[14px] font-semibold underline-offset-4 hover:underline"
        [style.color]="themeService.currentTheme().primaryColor"
      >
        Volver al inicio
      </a>
    </section>
  }

  @if (activeTab() === 'Personalización') {
    <section class="josanz-app-settings__panel">
      <p class="premium-desc mb-4 md:mb-6">
        Los cambios se aplican al instante y se guardan en este dispositivo.
      </p>
      <josanz-theme-personalization-panel />
    </section>
  }
</div>
