<div
  class="josanz-detail-root flex flex-col min-h-0 h-full"
  [class.josanz-detail-root--figma]="layoutVariant === 'figma-event'"
  [style.backgroundColor]="'var(--josanz-bg)'"
>
  @if (layoutVariant === 'figma-event') {
    <header class="josanz-detail-figma__top">
      <div class="josanz-detail-figma__title-row">

        <!-- Back button — larger tap target, subtle ring on hover -->
        <button
          type="button"
          class="josanz-detail-figma__back"
          (click)="back.emit()"
          aria-label="Volver"
          style="
            display:flex; align-items:center; justify-content:center;
            width:36px; height:36px; border-radius:50%;
            border:1.5px solid var(--josanz-border);
            background:var(--josanz-surface);
            color:var(--josanz-text);
            cursor:pointer;
            transition: background 0.15s, box-shadow 0.15s, transform 0.15s;
          "
          onmouseenter="this.style.boxShadow='0 0 0 3px color-mix(in srgb,var(--josanz-primary) 15%,transparent)'; this.style.background='var(--josanz-surface-muted)'"
          onmouseleave="this.style.boxShadow='none'; this.style.background='var(--josanz-surface)'"
          onmousedown="this.style.transform='scale(0.93)'"
          onmouseup="this.style.transform='scale(1)'"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>

        <!-- Title + status pill -->
        <div class="josanz-detail-figma__heading" style="display:flex; align-items:baseline; gap:10px; min-width:0; flex:1;">
          <h1 style="margin:0; font-size:clamp(20px,2.5vw,28px); font-weight:800; letter-spacing:-0.02em; line-height:1.1; color:var(--josanz-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ title }}</h1>
          @if (statusLabel) {
            <span
              class="josanz-detail-figma__status"
              [style.backgroundColor]="statusPillBg()"
              [style.color]="statusPillText()"
              style="white-space:nowrap; flex-shrink:0;"
            >
              {{ statusLabel }}
            </span>
          }
        </div>
      </div>

      <!-- User area -->
      <div class="josanz-detail-figma__user">
        <span style="font-size:13px; color:var(--josanz-text-muted);">{{ userLabel }}</span>
        <josanz-user-avatar [link]="avatarLink" [ariaLabel]="avatarAriaLabel"></josanz-user-avatar>
      </div>
    </header>

    <!-- Tabs row + Save button — with a bottom separator -->
    <div class="josanz-detail-figma__tabs-row" style="border-bottom:1px solid var(--josanz-border);">
      <josanz-main-tabs
        class="josanz-detail-figma__tabs"
        [options]="tabs"
        [selection]="activeTab"
        variant="figma"
        (selectionChange)="tabChange.emit($event)"
      ></josanz-main-tabs>
      <div class="josanz-detail-figma__save">
        <josanz-button
          [label]="saveLabel"
          [showIcon]="false"
          [fullWidth]="true"
          [disabled]="saveDisabled"
          [customColor]="saveDisabled ? undefined : '#0F1E2F'"
          (btnClick)="save.emit()"
        ></josanz-button>
      </div>
    </div>
  } @else {
    <div class="pb-6 flex flex-col gap-5 shrink-0">
      <div class="flex items-center gap-4">
        <button
          type="button"
          (click)="back.emit()"
          class="flex items-center justify-center w-9 h-9 rounded-full border border-solid hover:shadow-md active:scale-90 transition-all duration-200"
          [style.color]="'var(--josanz-text)'"
          [style.borderColor]="'var(--josanz-border)'"
          [style.backgroundColor]="'var(--josanz-surface)'"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <div class="flex flex-col gap-1">
          <h1 class="text-[26px] md:text-[32px] font-black tracking-tight leading-none" [style.color]="'var(--josanz-text)'">
            {{ title }}
          </h1>
          <div class="h-[3px] w-10 rounded-full" [style.background]="'linear-gradient(90deg, var(--josanz-interactive, var(--josanz-primary)), transparent)'"></div>
        </div>
      </div>

      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="w-full md:w-auto overflow-x-auto no-scrollbar">
          <josanz-main-tabs
            [options]="tabs"
            [selection]="activeTab"
            (selectionChange)="tabChange.emit($event)"
          ></josanz-main-tabs>
        </div>
        <div class="flex items-center gap-2 md:justify-end">
          <ng-content select="[header-actions]"></ng-content>
        </div>
      </div>
    </div>
  }

  <div
    class="josanz-detail-root__content flex-1 min-h-0 overflow-y-auto josanz-scroll-quiet"
    [class.josanz-detail-figma__content]="layoutVariant === 'figma-event'"
    [ngClass]="layoutVariant === 'figma-event' ? '' : (showFooterActions ? 'pb-40 md:pb-32' : 'pb-8 md:pb-12')"
  >
    <div [class.mx-auto]="layoutVariant !== 'figma-event'" [class.w-full]="layoutVariant !== 'figma-event'" [class.max-w-\[1200px\]]="layoutVariant !== 'figma-event'">
      <ng-content></ng-content>
    </div>
  </div>

  @if (showFooterActions && layoutVariant !== 'figma-event') {
    <div
      class="fixed bottom-0 left-0 md:left-[var(--josanz-sidebar-width)] right-0 h-auto md:h-[100px] flex flex-col md:flex-row items-center justify-end px-[var(--josanz-shell-pad-x)] md:px-[var(--josanz-shell-pad-x-md)] py-6 md:py-0 gap-3 md:gap-6 z-50 border-t backdrop-blur-md transition-all duration-300"
      [style.backgroundColor]="themeService.currentTheme().atmosphere.glass ? 'var(--josanz-glass)' : 'var(--josanz-surface)'"
      [style.borderColor]="'var(--josanz-border)'"
      [style.boxShadow]="'var(--josanz-footer-elev)'"
    >
      <div class="w-full md:w-auto order-2 md:order-1">
        <josanz-button
          [label]="cancelLabel"
          variant="ghost"
          size="lg"
          [showIcon]="false"
          [fullWidth]="true"
          (btnClick)="cancel.emit()"
        ></josanz-button>
      </div>
      <div class="w-full md:w-auto order-1 md:order-2">
        <josanz-button
          [label]="saveLabel"
          size="lg"
          [showIcon]="false"
          [fullWidth]="true"
          [disabled]="saveDisabled"
          (btnClick)="save.emit()"
        ></josanz-button>
      </div>
    </div>
  }
</div>
