<nav
  class="josanz-mobile-tab-bar border-t transition-all duration-300"
  [style.backgroundColor]="theme.currentTheme().atmosphere.glass ? 'var(--josanz-glass)' : 'var(--josanz-surface)'"
  [style.backdropFilter]="theme.currentTheme().atmosphere.glass ? 'blur(20px)' : 'none'"
  [style.borderColor]="'var(--josanz-border)'"
  [style.boxShadow]="'0 -10px 30px rgba(0,0,0,0.1)'"
  aria-label="Navegación principal"
>
  <div
    class="flex flex-1 items-center justify-between px-6 py-2"
    [style.paddingBottom]="'max(16px, env(safe-area-inset-bottom, 0px))'"
  >
    @for (tab of tabs; track tab.path) {
      @if (tab.prominent) {
        <a
          [routerLink]="tab.path"
          routerLinkActive="active"
          class="prominent-tab transition-all duration-200 active:scale-90"
          [style.backgroundColor]="'var(--josanz-primary)'"
          [style.boxShadow]="'0 8px 20px -4px var(--josanz-primary)'"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </a>
      } @else {
        <a
          [routerLink]="tab.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: tab.exact ?? false }"
          class="tab-link flex flex-col items-center gap-1 transition-all duration-200 active:scale-95 group"
          [style.color]="'var(--josanz-text-muted)'"
        >
          <div class="icon-container group-[.active]:text-[var(--josanz-accent)] group-[.active]:scale-110 transition-all">
            @if (tab.path === '/dashboard') {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12l9-9 9 9M5 10v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9" />
              </svg>
            } @else if (tab.path === '/clients') {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" />
                <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" />
                <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2" />
              </svg>
            } @else if (tab.path === '/events') {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
            } @else if (tab.path === '/settings') {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
            }
          </div>
          <span class="text-[10px] font-bold uppercase tracking-tighter group-[.active]:text-[var(--josanz-accent)]">{{ tab.label }}</span>
        </a>
      }
    }
  </div>
</nav>
