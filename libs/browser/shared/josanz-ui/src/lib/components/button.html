<button 
  (click)="onClick()"
  [disabled]="disabled"
  [style.width]="size === 'lg' ? '280px' : ''"
  [style.height]="size === 'lg' ? '48px' : ''"
  class="rounded-[8px] flex items-center justify-center gap-2 transition-all duration-200 active:scale-95 font-semibold text-[16px]"
  [class.bg-[#1A1A1A]]="variant === 'primary' && !disabled"
  [class.text-white]="variant === 'primary' && !disabled"
  [class.bg-[#A0A0A0]]="variant === 'primary' && disabled"
  [class.text-white]="variant === 'primary' && disabled"
  [class.bg-transparent]="variant === 'secondary'"
  [class.text-[#718096]]="variant === 'secondary'"
  [class.hover:bg-gray-50]="variant === 'secondary'"
  [class.px-4]="size === 'md'"
  [class.h-[37px]]="size === 'md'"
  [class.w-full]="fullWidth"
>
  <span>{{ label }}</span>
</button>
