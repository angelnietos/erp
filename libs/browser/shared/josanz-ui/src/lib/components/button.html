<button 
  (click)="onClick()"
  [disabled]="disabled"
  class="rounded-[8px] flex items-center justify-center gap-2 transition-all duration-200 active:scale-95"
  [class.bg-[#1A1A1A]]="variant === 'primary' && !disabled"
  [class.text-white]="variant === 'primary' && !disabled"
  [class.bg-[#A0A0A0]]="variant === 'primary' && disabled"
  [class.text-white/60]="variant === 'primary' && disabled"
  [class.bg-transparent]="variant === 'secondary'"
  [class.text-[#718096]]="variant === 'secondary'"
  [class.hover:text-[#1A1A1A]]="variant === 'secondary'"
  [class.cursor-not-allowed]="disabled"
  [class.shadow-[0px_4px_8px_0px_rgba(0,0,0,0.15)]]="variant === 'primary'"
  
  [class.px-4]="size === 'md'"
  [class.py-2]="size === 'md'"
  [class.h-[37px]]="size === 'md'"
  
  [class.w-[280px]]="size === 'lg'"
  [class.h-[48px]]="size === 'lg'"
  [class.w-full]="fullWidth"
>
  <span class="text-[16px] font-semibold tracking-tight">{{ label }}</span>
  <svg *ngIf="showIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </svg>
</button>
