<josanz-main-list-layout 
  [title]="title" 
  [primaryBtnLabel]="primaryBtnLabel"
  [filterOptions]="filterOptions"
  [paginationTotal]="5"
  [paginationPage]="1"
  (primaryAction)="onAdd()"
  (filterChange)="onFilter($event)"
  (excelAction)="onExcel()">
  
  <div class="josanz-list-thead">
    <div class="josanz-list-template-row-wrap w-full min-w-0 px-[var(--josanz-list-card-pad-x)] py-0 md:px-[var(--josanz-list-card-pad-x-md)] md:py-0"
    >
      <div class="josanz-list-template-row__title truncate">Nombre y Apellidos</div>
      <div class="josanz-list-template-row__fields">
        <div class="josanz-list-template-row__field josanz-list-template-row__field--w220 truncate">Email</div>
        <div class="josanz-list-template-row__field josanz-list-template-row__field--w160 truncate">Teléfono</div>
        <div class="josanz-list-template-row__field josanz-list-template-row__field--w160 truncate">Rol / Cargo</div>
        <div class="josanz-list-template-row__field josanz-list-template-row__field--grow truncate">Último acceso</div>
      </div>
      <div class="josanz-list-template-row__status"><span class="truncate">Estado</span></div>
    </div>
  </div>

  <josanz-adaptive-list-rows
    [items]="userItems"
    [defaultLabels]="userLabels"
    (itemClick)="openDetail()"
  ></josanz-adaptive-list-rows>
</josanz-main-list-layout>
