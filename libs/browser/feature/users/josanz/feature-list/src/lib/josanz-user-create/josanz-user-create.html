<josanz-modal title="Nuevo Usuari@" (close)="onCancel()">
  
  <div class="flex flex-col gap-8 w-full max-w-[619px] mx-auto">
    <!-- Avatar Section -->
    <div class="flex justify-start">
      <div class="avatar-container relative group cursor-pointer border-2 border-[#DEEDFF]">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" 
             class="avatar-img" 
             alt="User Avatar" />
        <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
      </div>
    </div>

    <!-- Form Fields -->
    <div class="grid grid-cols-1 gap-5 w-full">
      <josanz-input label="Nombre" placeholder="Nombre" controlName="nombre" [parentForm]="form"></josanz-input>
      <josanz-input label="Apellidos" placeholder="Apellidos" controlName="apellidos" [parentForm]="form"></josanz-input>
      <josanz-input label="Email" placeholder="email@email.com" type="email" controlName="email" [parentForm]="form"></josanz-input>
      <josanz-input label="Contraseña" placeholder="••••" type="password" controlName="password" [parentForm]="form"></josanz-input>
      <josanz-input label="Empresa" placeholder="Empresa" controlName="empresa" [parentForm]="form"></josanz-input>
      <josanz-input label="Rol" placeholder="Usuario" controlName="rol" [parentForm]="form"></josanz-input>
    </div>
  </div>

  <!-- Footer Actions (280x48 buttons) -->
  <div footer-actions class="flex justify-between w-full">
    <button (click)="onCancel()" class="w-[280px] h-[48px] text-[16px] font-medium text-[#718096] hover:text-[#1A1A1A] transition-colors">
      Cancelar
    </button>
    <josanz-button 
      label="Guardar cambios" 
      size="lg" 
      [showIcon]="false"
      (btnClick)="onSave()" 
      [disabled]="form.invalid">
    </josanz-button>
  </div>

</josanz-modal>
