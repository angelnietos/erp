<josanz-modal title="Nuevo Usuari@" (close)="onCancel()">
  
  <div class="flex flex-col gap-6">
    <!-- Avatar Section -->
    <div class="relative w-[64px] h-[64px] group cursor-pointer">
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="w-full h-full rounded-full object-cover border-2 border-[#DEEDFF]" />
      <div class="absolute inset-0 bg-black/20 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
    </div>

    <!-- Form Fields -->
    <div class="grid grid-cols-1 gap-4">
      <josanz-input label="Nombre" placeholder="Nombre" controlName="nombre" [parentForm]="form"></josanz-input>
      <josanz-input label="Apellidos" placeholder="Apellidos" controlName="apellidos" [parentForm]="form"></josanz-input>
      <josanz-input label="Email" placeholder="email@email.com" type="email" controlName="email" [parentForm]="form"></josanz-input>
      <josanz-input label="Contraseña" placeholder="••••" type="password" controlName="password" [parentForm]="form"></josanz-input>
      <josanz-input label="Empresa" placeholder="Empresa" controlName="empresa" [parentForm]="form"></josanz-input>
      <josanz-input label="Rol" placeholder="Usuario" controlName="rol" [parentForm]="form"></josanz-input>
    </div>
  </div>

  <!-- Footer Actions -->
  <div footer-actions>
    <josanz-button label="Guardar cambios" (btnClick)="onSave()" [disabled]="form.invalid"></josanz-button>
  </div>

</josanz-modal>
