<josanz-main-detail-layout
  title="Nuevo Usuario"
  layoutVariant="figma-event"
  [tabs]="[]"
  activeTab=""
  [showFooterActions]="false"
  (back)="onBack()"
  (save)="onSave()"
  (cancel)="onCancel()"
  saveLabel="Crear usuario"
  [saveDisabled]="form.invalid"
>
  <div class="josanz-event-create">
    <section>
      <h2 class="josanz-event-create__section-title">Identidad y acceso</h2>
      <div class="josanz-user-create__identity">
        <josanz-user-avatar size="lg"></josanz-user-avatar>
        <div class="josanz-event-create__grid-2 josanz-user-create__fields">
          <josanz-input label="Nombre" placeholder="Nombre" controlName="nombre" [parentForm]="form"></josanz-input>
          <josanz-input label="Apellidos" placeholder="Apellidos" controlName="apellidos" [parentForm]="form"></josanz-input>
          <josanz-input label="Email" placeholder="email@empresa.com" type="email" controlName="email" [parentForm]="form"></josanz-input>
          <josanz-input label="Contraseña" placeholder="••••••••" type="password" controlName="password" [parentForm]="form"></josanz-input>
        </div>
      </div>
    </section>

    <section>
      <h2 class="josanz-event-create__section-title">Organización</h2>
      <div class="josanz-event-create__fields">
        <josanz-input label="Empresa" placeholder="Empresa u organización" controlName="empresa" [parentForm]="form"></josanz-input>
        <josanz-input label="Rol" placeholder="Usuario, operario…" controlName="rol" [parentForm]="form"></josanz-input>
        <p class="josanz-user-create__hint">
          Los permisos finos se podrán ajustar tras crear la cuenta, cuando el módulo de permisos esté enlazado.
        </p>
      </div>
    </section>
  </div>
</josanz-main-detail-layout>
