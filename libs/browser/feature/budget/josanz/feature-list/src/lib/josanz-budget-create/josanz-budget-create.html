<josanz-main-detail-layout
  title="Nuevo presupuesto"
  layoutVariant="figma-event"
  [tabs]="[]"
  activeTab=""
  [showFooterActions]="false"
  (back)="onBack()"
  (save)="onSave()"
  (cancel)="onCancel()"
  saveLabel="Crear presupuesto"
  [saveDisabled]="form.invalid"
>
  <div class="josanz-event-create">
    <section>
      <h2 class="josanz-event-create__section-title">Datos generales</h2>
      <div class="josanz-event-create__fields">
        <josanz-input
          label="Cliente"
          placeholder="Seleccione un cliente"
          controlName="cliente"
          [parentForm]="form"
        ></josanz-input>
        <josanz-input label="Fecha" type="date" controlName="fecha" [parentForm]="form"></josanz-input>
        <josanz-input
          label="Evento vinculado"
          placeholder="Opcional — evento asociado"
          controlName="evento"
          [parentForm]="form"
        ></josanz-input>
      </div>
    </section>

    <section>
      <h2 class="josanz-event-create__section-title">Condiciones</h2>
      <div class="josanz-event-create__fields">
        <josanz-input label="Válido hasta" type="date" controlName="validoHasta" [parentForm]="form"></josanz-input>
        <josanz-input
          label="Notas"
          placeholder="Notas adicionales para el cliente…"
          controlName="notas"
          [parentForm]="form"
        ></josanz-input>
        <p class="josanz-user-create__hint">
          Tras crear el presupuesto podrás añadir líneas, documentación y enviarlo al cliente desde el detalle.
        </p>
      </div>
    </section>
  </div>
</josanz-main-detail-layout>
