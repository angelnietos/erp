<josanz-main-detail-layout
  title="Nuevo almacén"
  layoutVariant="figma-event"
  [tabs]="[]"
  activeTab=""
  [showFooterActions]="false"
  (back)="onBack()"
  (save)="onSave()"
  (cancel)="onCancel()"
  saveLabel="Crear almacén"
  [saveDisabled]="form.invalid"
>
  <div class="josanz-event-create">
    <section>
      <h2 class="josanz-event-create__section-title">Identificación</h2>
      <div class="josanz-event-create__grid-2">
        <josanz-input label="Nombre del almacén" placeholder="Almacén Central" controlName="nombre" [parentForm]="form"></josanz-input>
        <josanz-input label="Código interno" placeholder="ALM-01" controlName="codigo" [parentForm]="form"></josanz-input>
      </div>
    </section>

    <section>
      <h2 class="josanz-event-create__section-title">Ubicación y notas</h2>
      <div class="josanz-event-create__fields">
        <josanz-input label="Dirección" placeholder="Calle, población…" controlName="direccion" [parentForm]="form"></josanz-input>
        <josanz-input label="Notas" placeholder="Horario, contacto…" controlName="notas" [parentForm]="form"></josanz-input>
      </div>
    </section>
  </div>
</josanz-main-detail-layout>
