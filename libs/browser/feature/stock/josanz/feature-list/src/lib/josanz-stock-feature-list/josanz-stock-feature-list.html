<josanz-main-list-layout
  [title]="title"
  [primaryBtnLabel]="'Añadir producto'"
  [secondaryBtnLabel]="'Añadir Almacén'"
  [filterOptions]="filterOptions"
  [paginationTotal]="10"
  [paginationPage]="1"
  [paginationVariant]="'numbered'"
  [searchValue]="searchQuery"
  [figmaCatalogLayout]="true"
  [summaryLine]="summaryLine"
  searchPlaceholder="Buscar"
  (searchChange)="onSearch($event)"
  (primaryAction)="onAdd()"
  (secondaryAction)="onAddWarehouse()"
  (filterChange)="onFilter($event)"
  (excelAction)="onExcel()"
>
  <josanz-list-template-header-row
    titleLabel="Referencia"
    [fieldLabels]="stockLabels"
    statusLabel="Estado"
  ></josanz-list-template-header-row>

  <josanz-adaptive-list-rows
    [items]="filteredStockItems"
    [defaultLabels]="stockLabels"
    (itemClick)="openProductDetail($event.id)"
  ></josanz-adaptive-list-rows>
</josanz-main-list-layout>
