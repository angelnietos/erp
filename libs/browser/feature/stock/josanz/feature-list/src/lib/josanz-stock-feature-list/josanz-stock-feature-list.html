<josanz-main-list-layout
  [title]="title"
  [primaryBtnLabel]="primaryBtnLabel"
  [filterOptions]="filterOptions"
  [paginationTotal]="10"
  [paginationPage]="1"
  [searchValue]="searchQuery"
  [figmaCatalogLayout]="true"
  typologyTabsVariant="figma"
  [showViewSelector]="true"
  searchPlaceholder="Buscar"
  (searchChange)="onSearch($event)"
  (primaryAction)="onAdd()"
  (filterChange)="onFilter($event)"
  (excelAction)="onExcel()"
>
  <div extra-filters class="flex flex-col gap-3">
    <josanz-main-tabs
      [options]="['Productos / lotes', 'Productos en alquiler']"
      [selection]="activeType"
      (selectionChange)="onTypeChange($event)"
      shape="rounded"
    >
    </josanz-main-tabs>
    <josanz-filter-tabs
      [options]="secondaryFilterOptions"
      (selectionChange)="onSecondaryFilterChange($event)"
    >
    </josanz-filter-tabs>
  </div>

  <div extra-actions>
    @if (activeType === 'Productos / lotes') {
    <josanz-button
      label="Nuevo almacén +"
      [showIcon]="false"
      variant="primary"
      (btnClick)="onAddWarehouse()"
    >
    </josanz-button>
    }
  </div>

  <josanz-list-template-header-row
    titleLabel="Referencia"
    [fieldLabels]="stockLabels"
    statusLabel="Estado"
    [withLeadingMark]="false"
  ></josanz-list-template-header-row>

  <josanz-adaptive-list-rows
    [items]="filteredStockItems"
    [defaultLabels]="stockLabels"
    (itemClick)="openProductDetail($event.id)"
  ></josanz-adaptive-list-rows>
</josanz-main-list-layout>
