<josanz-main-list-layout 
  [title]="title" 
  [primaryBtnLabel]="primaryBtnLabel"
  [filterOptions]="filterOptions"
  [paginationTotal]="10"
  [paginationPage]="1"
  (primaryAction)="onAdd()"
  (filterChange)="onFilter($event)"
  (excelAction)="onExcel()">

  <!-- Extra Filters for Stock (Type selection using the new MainTabs) -->
  <div extra-filters class="flex flex-col gap-4 -order-1 mb-2">
    <josanz-main-tabs 
      [options]="['Productos / lotes', 'Productos en alquiler']"
      [selection]="activeType"
      (selectionChange)="onTypeChange($event)"
      shape="rounded">
    </josanz-main-tabs>
  </div>

  <div extra-filters>
    <josanz-filter-tabs 
      [options]="secondaryFilterOptions"
      (selectionChange)="onSecondaryFilterChange($event)">
    </josanz-filter-tabs>
  </div>

  <!-- Extra Action for Stock (Conditional) -->
  <div extra-actions>
    @if (activeType === 'Productos / lotes') {
      <josanz-button 
        label="Nuevo almacén +" 
        [showIcon]="false"
        variant="primary"
        (btnClick)="onAddWarehouse()">
      </josanz-button>
    }
  </div>
  
  <!-- Table Header: desktop only -->
  <div
    class="hidden md:flex items-center px-6 mb-2 w-full text-[11px] font-bold uppercase tracking-[0.2em]"
    [style.color]="themeService.currentTheme().atmosphere.textMuted">
    <div class="w-[200px] shrink-0">Referencia</div>
    <div class="flex flex-1 items-center gap-6 overflow-hidden">
      <div class="w-[220px] shrink-0">Nombre Producto</div>
      <div class="w-[160px] shrink-0">Categoría</div>
      <div class="w-[160px] shrink-0">Stock Actual</div>
      <div class="flex-1">Almacén</div>
    </div>
    <div class="w-[140px] shrink-0 text-right">Estado</div>
  </div>

  <!-- Content -->
  <div class="flex flex-col gap-4">
    @for (item of stockItems; track item.id) {
      <josanz-main-template-card
        style="cursor: pointer; display: block;"
        (click)="openProductDetail(item.id)"
        [title]="item.ref"
        [data]="[item.name, item.cat, item.stock, item.wh]"
        [labels]="['Producto', 'Categoría', 'Stock', 'Almacén']"
        [status]="item.status"
        [statusVariant]="
          item.status === 'En Stock' ? 'success' : item.status === 'Agotado' ? 'error' : 'warning'
        "
      ></josanz-main-template-card>
    }
  </div>
</josanz-main-list-layout>
