<josanz-main-list-layout 
  [title]="title" 
  [primaryBtnLabel]="primaryBtnLabel"
  [filterOptions]="filterOptions"
  [paginationTotal]="10"
  [paginationPage]="1"
  (primaryAction)="onAdd()"
  (filterChange)="onFilter($event)"
  (excelAction)="onExcel()">

  <!-- Extra Filters for Stock (Type selection using the new MainTabs) -->
  <div extra-filters class="flex flex-col gap-4 -order-1 mb-2">
    <josanz-main-tabs 
      [options]="['Productos / lotes', 'Productos en alquiler']"
      [selection]="activeType"
      (selectionChange)="onTypeChange($event)"
      shape="rounded">
    </josanz-main-tabs>
  </div>

  <div extra-filters>
    <josanz-filter-tabs 
      [options]="secondaryFilterOptions"
      (selectionChange)="onSecondaryFilterChange($event)">
    </josanz-filter-tabs>
  </div>

  <!-- Extra Action for Stock (Conditional) -->
  <div extra-actions>
    @if (activeType === 'Productos / lotes') {
      <josanz-button 
        label="Nuevo almacén +" 
        [showIcon]="false"
        variant="primary"
        (btnClick)="onAddWarehouse()">
      </josanz-button>
    }
  </div>
  
  <!-- Table Header: desktop only -->
  <div class="josanz-list-thead josanz-list-thead--compact">
    <div
      class="josanz-list-template-row-wrap w-full min-w-0 px-[var(--josanz-list-card-pad-x)] py-0 md:px-[var(--josanz-list-card-pad-x-md)] md:py-0"
    >
      <div class="josanz-list-template-row__title truncate">Referencia</div>
      <div class="josanz-list-template-row__fields">
        <div class="josanz-list-template-row__field josanz-list-template-row__field--w220 truncate">Nombre Producto</div>
        <div class="josanz-list-template-row__field josanz-list-template-row__field--w160 truncate">Categoría</div>
        <div class="josanz-list-template-row__field josanz-list-template-row__field--w160 truncate">Stock Actual</div>
        <div class="josanz-list-template-row__field josanz-list-template-row__field--grow truncate">Almacén</div>
      </div>
      <div class="josanz-list-template-row__status"><span class="truncate">Estado</span></div>
    </div>
  </div>

  <!-- Content -->
  <div class="flex flex-col gap-4">
    @for (item of stockItems; track item.id) {
      <josanz-main-template-card
        style="cursor: pointer; display: block;"
        (click)="openProductDetail(item.id)"
        [title]="item.ref"
        [data]="[item.name, item.cat, item.stock, item.wh]"
        [labels]="['Producto', 'Categoría', 'Stock', 'Almacén']"
        [status]="item.status"
        [statusVariant]="
          item.status === 'En Stock' ? 'success' : item.status === 'Agotado' ? 'error' : 'warning'
        "
      ></josanz-main-template-card>
    }
  </div>
</josanz-main-list-layout>
