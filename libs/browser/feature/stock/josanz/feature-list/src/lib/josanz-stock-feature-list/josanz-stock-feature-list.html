<josanz-main-list-layout
  [title]="title"
  [primaryBtnLabel]="primaryBtnLabel"
  [secondaryBtnLabel]="'Nuevo almacén +'"
  [filterOptions]="filterOptions"
  [paginationTotal]="10"
  [paginationPage]="1"
  [searchValue]="searchQuery"
  [figmaCatalogLayout]="true"
  typologyTabsVariant="figma"
  [showViewSelector]="true"
  searchPlaceholder="Buscar"
  (searchChange)="onSearch($event)"
  (primaryAction)="onAdd()"
  (secondaryAction)="onAddWarehouse()"
  (filterChange)="onFilter($event)"
  (excelAction)="onExcel()"
>
  <div extra-filters class="flex w-full min-w-0 flex-col gap-3">
    <div class="josanz-catalog-summary" role="group" aria-label="Resumen stock">
      <span class="josanz-catalog-summary__item josanz-catalog-summary__item--active">Total</span>
      @for (stat of summaryStats; track stat.label) {
      <span class="josanz-catalog-summary__item">
        {{ stat.label }}
        <strong>{{ stat.count }}</strong>
      </span>
      }
    </div>

    <div class="flex flex-col gap-3">
      <josanz-main-tabs
        [options]="typeTabs"
        [selection]="activeType"
        (selectionChange)="onTypeChange($event)"
        shape="rounded"
        [dense]="true"
      ></josanz-main-tabs>
      <josanz-filter-tabs
        [options]="statusFilterOptions"
        [selected]="activeStatusFilter"
        (selectionChange)="onStatusFilter($event)"
      ></josanz-filter-tabs>
    </div>
  </div>

  <josanz-list-template-header-row
    titleLabel="Referencia"
    [fieldLabels]="stockLabels"
    statusLabel="Estado"
  ></josanz-list-template-header-row>

  <josanz-adaptive-list-rows
    [items]="filteredStockItems"
    [defaultLabels]="stockLabels"
    (itemClick)="openProductDetail($event.id)"
  ></josanz-adaptive-list-rows>
</josanz-main-list-layout>
