<josanz-main-list-layout 
  [title]="title" 
  [primaryBtnLabel]="primaryBtnLabel"
  [filterOptions]="filterOptions"
  (primaryAction)="onAdd()"
  (filterChange)="onFilter($event)"
  (excelAction)="onExcel()">

  <!-- Extra Filters for Stock (Type selection) -->
  <div extra-filters>
    <josanz-filter-tabs [options]="['Productos / lotes', 'Productos en alquiler']"></josanz-filter-tabs>
  </div>

  <!-- Extra Action for Stock -->
  <div extra-actions>
    <josanz-button label="Nuevo almacén" (btnClick)="onAddWarehouse()"></josanz-button>
  </div>
  
  <josanz-main-template-card></josanz-main-template-card>
  <josanz-main-template-card></josanz-main-template-card>
  <josanz-main-template-card></josanz-main-template-card>
  <josanz-main-template-card></josanz-main-template-card>

</josanz-main-list-layout>
