<josanz-main-list-layout 
  [title]="title" 
  [primaryBtnLabel]="primaryBtnLabel"
  [filterOptions]="filterOptions"
  (primaryAction)="onAdd()"
  (filterChange)="onFilter($event)"
  (excelAction)="onExcel()">

  <!-- Extra Filters for Stock (Type selection) -->
  <div extra-filters>
    <josanz-filter-tabs 
      [options]="['Productos / lotes', 'Productos en alquiler']"
      (selectionChange)="onTypeChange($event)">
    </josanz-filter-tabs>
  </div>

  <!-- Extra Action for Stock (Conditional) -->
  <div extra-actions>
    <josanz-button 
      *ngIf="activeType === 'Productos / lotes'"
      label="Nuevo almacén" 
      (btnClick)="onAddWarehouse()">
    </josanz-button>
  </div>
  
  <!-- Content -->
  <josanz-main-template-card></josanz-main-template-card>
  <josanz-main-template-card></josanz-main-template-card>
  <josanz-main-template-card></josanz-main-template-card>
  <josanz-main-template-card></josanz-main-template-card>

</josanz-main-list-layout>
