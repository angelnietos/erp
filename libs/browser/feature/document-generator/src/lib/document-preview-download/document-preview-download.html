<div class="space-y-6">
  <div class="dg-panel">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-3 min-w-0">
        <button type="button" (click)="goBack()" class="dg-btn dg-btn-secondary dg-btn-sm">
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
          Volver
        </button>
        <div class="min-w-0">
          <h1 class="dg-hero__title text-lg">Vista previa del PDF</h1>
          <p class="text-sm text-secondary truncate">{{ document?.title }}</p>
        </div>
      </div>

      <button
        type="button"
        (click)="downloadPdf()"
        [disabled]="!pdfUrl || isGenerating"
        class="dg-btn dg-btn-primary"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
          ></path>
        </svg>
        Descargar PDF
      </button>
    </div>
  </div>

  <div class="dg-panel overflow-hidden">
    <div class="aspect-[3/4] w-full min-h-[28rem]">
      <div
        *ngIf="isGenerating"
        class="flex items-center justify-center h-full dg-callout dg-callout--neutral rounded-xl"
      >
        <div class="text-center">
          <div
            class="animate-spin rounded-full h-10 w-10 border-2 border-brand border-t-transparent mx-auto"
            aria-hidden="true"
          ></div>
          <p class="mt-4 text-secondary text-sm">Generando PDF…</p>
        </div>
      </div>

      <div
        *ngIf="pdfError && !isGenerating"
        class="flex items-center justify-center h-full dg-alert-error rounded-xl p-6"
        role="alert"
      >
        <p class="text-sm text-center max-w-md">{{ pdfError }}</p>
      </div>

      <iframe
        *ngIf="pdfUrl && !isGenerating"
        [src]="pdfUrl"
        class="w-full h-full border-0 rounded-xl dg-preview-render"
        title="Vista previa PDF"
      ></iframe>
    </div>
  </div>
</div>
