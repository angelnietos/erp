<josanz-main-detail-layout 
  title="Detalle de Albarán" 
  [tabs]="tabs" 
  [activeTab]="activeTab()" 
  (tabChange)="setTab($event)"
  (back)="onBack()"
  (save)="onSave()"
  (cancel)="onCancel()"
>
  <div class="py-4">
    <!-- Tab: General -->
    @if (activeTab() === 'General') {
      <div class="grid grid-cols-2 gap-8 py-4">
        <div class="space-y-6">
          <div class="text-[14px] font-medium uppercase" style="color: var(--josanz-text-muted)">Información del Albarán</div>
          <div class="p-6 rounded-xl space-y-4" style="background-color: var(--josanz-bg); box-shadow: var(--josanz-shadow)">
            <div><span class="block text-[12px]" style="color: var(--josanz-text-muted)">Nº Albarán</span><span class="font-medium" style="color: var(--josanz-text)">ALB-2024-055</span></div>
            <div><span class="block text-[12px]" style="color: var(--josanz-text-muted)">Cliente</span><span class="font-medium" style="color: var(--josanz-text)">Hotel Playa Sol</span></div>
            <div><span class="block text-[12px]" style="color: var(--josanz-text-muted)">Fecha de Entrega</span><span class="font-medium" style="color: var(--josanz-text)">14/05/2024</span></div>
            <div><span class="block text-[12px]" style="color: var(--josanz-text-muted)">Estado</span><span class="font-medium" style="color: var(--josanz-primary)">Entregado</span></div>
          </div>
        </div>
      </div>
    }

    <!-- Tab: Artículos -->
    @if (activeTab() === 'Artículos') {
      <div class="py-10 text-center text-[#989898]">
        Sección de artículos en desarrollo.
      </div>
    }

    <!-- Tab: Firmas -->
    @if (activeTab() === 'Firmas') {
      <div class="py-10 text-center text-[#989898]">
        No hay firmas registradas.
      </div>
    }
  </div>
</josanz-main-detail-layout>
