<josanz-main-list-layout
  [title]="title"
  [primaryBtnLabel]="primaryBtnLabel"
  [filterOptions]="filterOptions"
  [paginationTotal]="5"
  [paginationPage]="1"
  [searchValue]="searchQuery"
  searchPlacement="actions"
  (searchChange)="onSearch($event)"
  (primaryAction)="onAdd()"
  (filterChange)="onFilter($event)"
  (excelAction)="onExcel()"
>
  <josanz-list-template-header-row
    titleLabel="Nº Albarán"
    [fieldLabels]="deliveryLabels"
    statusLabel="Estado"
  ></josanz-list-template-header-row>

  <josanz-adaptive-list-rows
    [items]="filteredDeliveryItems"
    [defaultLabels]="deliveryLabels"
    (itemClick)="openDetail()"
  ></josanz-adaptive-list-rows>
</josanz-main-list-layout>
