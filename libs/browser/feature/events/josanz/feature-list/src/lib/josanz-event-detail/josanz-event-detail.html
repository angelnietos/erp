<josanz-main-detail-layout
  title="Detalle de evento"
  [showFooterActions]="false"
  [tabs]="tabs"
  [activeTab]="activeTab()"
  (tabChange)="setTab($event)"
  (back)="onBack()"
  (save)="onSave()"
  (cancel)="onCancel()"
>
  <div class="py-2 md:py-4">
    @if (activeTab() === 'General') {
      <div class="grid grid-cols-1 gap-6 py-2 lg:grid-cols-2 lg:gap-8">
        <div class="space-y-4">
          <h2 class="text-[12px] font-bold uppercase tracking-[0.2em]" style="color: var(--josanz-text-muted)">
            Información general
          </h2>
          <div
            class="space-y-5 rounded-2xl border border-solid p-6 md:p-7"
            style="background-color: var(--josanz-surface); border-color: var(--josanz-border); box-shadow: var(--josanz-card-shadow)"
          >
            @for (row of infoRows; track row.label) {
              <div
                class="flex flex-col gap-1 border-b border-solid pb-4 last:border-0 last:pb-0"
                style="border-color: var(--josanz-border)"
              >
                <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--josanz-text-muted)">{{
                  row.label
                }}</span>
                <span
                  class="text-[16px] font-extrabold leading-snug"
                  [style.color]="row.accent ? 'var(--josanz-primary)' : 'var(--josanz-text)'"
                  >{{ row.value }}</span
                >
              </div>
            }
          </div>
        </div>
        <div
          class="flex min-h-[200px] flex-col items-center justify-center gap-2 rounded-2xl border border-dashed px-6 py-12 text-center"
          style="border-color: var(--josanz-border); background-color: var(--josanz-surface-muted); color: var(--josanz-text-muted)"
        >
          <span class="text-[14px] font-semibold" style="color: var(--josanz-text)">Resumen operativo</span>
          <p class="m-0 max-w-sm text-[13px] leading-relaxed">Contenido de pestaña en construcción.</p>
        </div>
      </div>
    } @else {
      <div
        class="flex min-h-[220px] flex-col items-center justify-center gap-2 rounded-2xl border border-dashed px-6 py-14 text-center"
        style="border-color: var(--josanz-border); background-color: var(--josanz-surface); color: var(--josanz-text-muted)"
      >
        <span class="text-[15px] font-semibold" style="color: var(--josanz-text)">{{ activeTab() }}</span>
        <p class="m-0 max-w-md text-[14px] leading-relaxed">Sección pendiente de definición.</p>
      </div>
    }
  </div>
</josanz-main-detail-layout>
