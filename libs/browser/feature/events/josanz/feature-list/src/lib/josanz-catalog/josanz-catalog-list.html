<josanz-main-list-layout
  [title]="config.title"
  [primaryBtnLabel]="config.primaryBtnLabel"
  [secondaryBtnLabel]="config.secondaryBtnLabel ?? ''"
  [filterOptions]="filterOptions"
  [figmaCatalogLayout]="true"
  [typologyTabsVariant]="'underline'"
  [showViewSelector]="true"
  [searchPlaceholder]="'Buscar'"
  [paginationTotal]="10"
  [paginationPage]="1"
  [searchValue]="searchQuery"
  (searchChange)="onSearch($event)"
  (primaryAction)="onAdd()"
  (secondaryAction)="onSecondary()"
  (filterChange)="onTypologyFilter()"
  (excelAction)="onExcel()"
>
  <div extra-filters class="flex w-full min-w-0 flex-col gap-3">
    <div class="josanz-catalog-summary" role="group" aria-label="Resumen por estado">
      <span class="josanz-catalog-summary__item josanz-catalog-summary__item--active">Total</span>
      @for (stat of summaryStats; track stat.label) {
        <span class="josanz-catalog-summary__item">
          {{ stat.label }}
          <strong>{{ stat.count }}</strong>
        </span>
      }
    </div>

    <div class="josanz-catalog-filters-row">
      <josanz-secondary-button label="De X a X" class="shrink-0"></josanz-secondary-button>
      <josanz-secondary-button label="Proveedores" class="shrink-0"></josanz-secondary-button>
      <josanz-secondary-button label="Staff" class="shrink-0"></josanz-secondary-button>
      <span class="josanz-catalog-filters-row__divider" aria-hidden="true"></span>
      <josanz-filter-tabs
        class="min-w-0 flex-1"
        [options]="statusFilterOptions"
        [selected]="selectedStatusFilter"
        (selectionChange)="onStatusFilter($event)"
      ></josanz-filter-tabs>
    </div>
  </div>

  <josanz-list-template-header-row
    [titleLabel]="config.idColumnLabel ?? 'ID'"
    [fieldLabels]="rowLabels"
    [statusLabel]="config.statusColumnLabel"
  ></josanz-list-template-header-row>

  <josanz-adaptive-list-rows
    [items]="adaptiveItems"
    [defaultLabels]="rowLabels"
    (itemClick)="onRowClick($event)"
  ></josanz-adaptive-list-rows>
</josanz-main-list-layout>
