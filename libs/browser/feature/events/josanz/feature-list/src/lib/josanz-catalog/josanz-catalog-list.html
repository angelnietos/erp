<josanz-main-list-layout
  [title]="config.title"
  [primaryBtnLabel]="config.primaryBtnLabel"
  [secondaryBtnLabel]="config.secondaryBtnLabel ?? ''"
  [filterOptions]="filterOptions"
  [paginationTotal]="10"
  [paginationPage]="1"
  (primaryAction)="onAdd()"
  (secondaryAction)="onSecondary()"
  (filterChange)="onTypologyFilter($event)"
  (excelAction)="onExcel()"
>
  <div extra-filters class="flex w-full min-w-0 flex-col gap-3">
    <p class="m-0 text-[13px] font-semibold leading-snug" style="color: var(--josanz-text-muted)">
      {{ summaryText }}
    </p>
    <div class="flex w-full min-w-0 flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
      <div class="flex min-w-0 flex-1 flex-wrap items-center gap-2">
        <josanz-secondary-button label="Fecha" class="shrink-0"></josanz-secondary-button>
        <josanz-filter-tabs
          class="min-w-0 flex-1"
          [options]="statusFilterOptions"
          [selected]="activeStatusFilter"
          (selectionChange)="onStatusFilter($event)"
        ></josanz-filter-tabs>
      </div>
      <josanz-list-search-field
        class="w-full lg:w-auto"
        placeholder="Buscar…"
        [value]="searchQuery"
        (valueChange)="onSearch($event)"
      ></josanz-list-search-field>
    </div>
  </div>

  <div class="josanz-list-thead">
    <div
      class="josanz-list-template-row-wrap w-full min-w-0 px-[var(--josanz-list-card-pad-x)] py-0 md:px-[var(--josanz-list-card-pad-x-md)] md:py-0"
    >
      <div class="josanz-list-template-row__title truncate">ID</div>
      <div class="josanz-list-template-row__fields">
        <div class="josanz-list-template-row__field josanz-list-template-row__field--w220 truncate">Nombre evento</div>
        <div class="josanz-list-template-row__field josanz-list-template-row__field--w160 truncate">Fecha</div>
        <div class="josanz-list-template-row__field josanz-list-template-row__field--w160 truncate">Cliente</div>
        <div class="josanz-list-template-row__field josanz-list-template-row__field--grow truncate">Operador</div>
      </div>
      <div class="josanz-list-template-row__status">
        <span class="truncate">{{ config.statusColumnLabel }}</span>
      </div>
    </div>
  </div>

  <josanz-adaptive-list-rows
    [items]="adaptiveItems"
    [defaultLabels]="rowLabels"
    (itemClick)="onRowClick($event)"
  ></josanz-adaptive-list-rows>
</josanz-main-list-layout>
