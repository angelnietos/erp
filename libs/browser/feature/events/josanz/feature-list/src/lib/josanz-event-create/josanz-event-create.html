<josanz-main-detail-layout
  title="Nuevo evento"
  layoutVariant="figma-event"
  [tabs]="[]"
  activeTab=""
  (back)="onBack()"
  (save)="onSave()"
  (cancel)="onCancel()"
  saveLabel="Crear evento"
  [saveDisabled]="form.invalid"
  [showFooterActions]="false"
>
  <div class="josanz-event-create">
    <section>
      <h2 class="josanz-event-create__section-title">Tipo de evento</h2>
      <div class="josanz-event-create__type-row" role="group" aria-label="Tipo de evento">
        @for (type of eventTypes; track type) {
          <button
            type="button"
            class="josanz-event-create__type-pill"
            [class.josanz-event-create__type-pill--active]="selectedType() === type"
            (click)="selectType(type)"
          >
            {{ type }}
          </button>
        }
      </div>
    </section>

    <section>
      <h2 class="josanz-event-create__section-title">Datos del evento</h2>
      <div class="josanz-event-create__fields">
        <josanz-input
          label="Nombre evento"
          placeholder="Nombre ejemplo"
          controlName="nombre"
          [parentForm]="form"
        ></josanz-input>
        <josanz-input
          label="Localización"
          placeholder="Dirección ejemplo"
          controlName="localizacion"
          [parentForm]="form"
        ></josanz-input>
        <josanz-input
          label="Fecha evento"
          type="date"
          placeholder="dd/mm/aaaa"
          controlName="fecha"
          [parentForm]="form"
        ></josanz-input>
        <josanz-input
          label="Montaje"
          placeholder="(* a qué se refiere este dato?)"
          controlName="montaje"
          [parentForm]="form"
        ></josanz-input>
      </div>
    </section>

    <section>
      <h2 class="josanz-event-create__section-title">Datos del cliente</h2>
      <div class="josanz-event-create__grid-2">
        <josanz-input
          label="nombre y Apellidos / Razón social"
          placeholder="Cliente A"
          controlName="cliente"
          [parentForm]="form"
        ></josanz-input>
        <josanz-input
          label="Operador"
          placeholder="Operador A"
          controlName="operador"
          [parentForm]="form"
        ></josanz-input>
      </div>
    </section>
  </div>
</josanz-main-detail-layout>
