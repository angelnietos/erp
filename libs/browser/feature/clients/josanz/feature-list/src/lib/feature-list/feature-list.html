<josanz-main-list-layout 
  [title]="title" 
  [primaryBtnLabel]="primaryBtnLabel"
  [filterOptions]="filterOptions"
  [paginationTotal]="10"
  [paginationPage]="1"
  (primaryAction)="onAdd()"
  (filterChange)="onFilter($event)"
  (excelAction)="onExcel()">
  
  <!-- Cabecera tabla: desktop only -->
  <div class="josanz-list-thead">
    <div
      class="josanz-list-template-row-wrap w-full min-w-0 px-[var(--josanz-list-card-pad-x)] py-0 md:px-[var(--josanz-list-card-pad-x-md)] md:py-0"
    >
      <div class="josanz-list-template-row__title truncate">Nombre Empresa</div>
      <div class="josanz-list-template-row__fields">
        <div class="josanz-list-template-row__field josanz-list-template-row__field--w220 truncate">Email Contacto</div>
        <div class="josanz-list-template-row__field josanz-list-template-row__field--w160 truncate">CIF/NIF</div>
        <div class="josanz-list-template-row__field josanz-list-template-row__field--w160 truncate">Población</div>
        <div class="josanz-list-template-row__field josanz-list-template-row__field--grow truncate">Última factura</div>
      </div>
      <div class="josanz-list-template-row__status"><span class="truncate">Estado</span></div>
    </div>
  </div>

  <josanz-adaptive-list-rows
    [items]="clientItems"
    [defaultLabels]="clientLabels"
    (itemClick)="openDetail()"
  ></josanz-adaptive-list-rows>

</josanz-main-list-layout>
