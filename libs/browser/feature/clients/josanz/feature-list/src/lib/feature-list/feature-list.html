@if (showSuccessToast) {
<div class="josanz-client-success-toast" role="status">
  <span aria-hidden="true">✓</span>
  Cliente creado correctamente
  <button
    type="button"
    class="josanz-client-success-toast__close"
    aria-label="Cerrar"
    (click)="dismissToast()"
  >
    ×
  </button>
</div>
}

<josanz-catalog-list [config]="config" />
