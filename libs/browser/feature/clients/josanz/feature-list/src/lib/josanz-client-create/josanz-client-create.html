<div class="josanz-client-create-page">
  <header class="josanz-client-create-page__header">
    <div class="josanz-client-create-page__title-row">
      <button type="button" class="josanz-client-create-page__back" aria-label="Volver" (click)="onBack()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <h1 class="josanz-client-create-page__title">Nuevo Cliente</h1>
    </div>
    <div class="flex items-center gap-2 text-[13px] font-semibold" style="color: var(--josanz-text-muted)">
      <span>Usuari&#64;</span>
      <josanz-user-avatar [link]="null" ariaLabel="Usuario"></josanz-user-avatar>
    </div>
  </header>

  <article class="josanz-client-create-card">
    <div class="josanz-client-create-logo" aria-hidden="true">
      <span>NB</span>
      <span style="font-size: 8px; font-weight: 600; opacity: 0.7">NOVABYTE</span>
    </div>

    <form class="josanz-client-create-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="josanz-client-field">
        <label for="razonSocial">Nombre Apellidos / Razón social</label>
        <input id="razonSocial" type="text" formControlName="razonSocial" autocomplete="organization" />
      </div>

      <div class="josanz-client-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
      </div>

      <div class="josanz-client-field">
        <label for="telefono">Teléfono</label>
        <input id="telefono" type="tel" formControlName="telefono" autocomplete="tel" />
      </div>

      <div class="josanz-client-field">
        <label for="tipo">Tipo de cliente</label>
        <div class="josanz-client-type-field">
          <span class="josanz-client-type-chip" [ngStyle]="pillStyle(selectedTypePillKey())">
            {{ selectedTypeLabel() }}
          </span>
          <select id="tipo" formControlName="tipo" aria-label="Tipo de cliente">
            @for (tipo of clientTypes; track tipo.value) {
              <option [value]="tipo.value">{{ tipo.label }}</option>
            }
          </select>
        </div>
      </div>

      <div class="josanz-client-create-actions">
        <button type="button" class="josanz-client-create-cancel" (click)="onCancel()">Cancelar</button>
        <josanz-button
          label="Añadir"
          [showIcon]="false"
          [disabled]="form.invalid"
          customColor="#0F1E2F"
          (btnClick)="onSubmit()"
        ></josanz-button>
      </div>
    </form>
  </article>

  <section class="josanz-client-operadores" aria-label="Operadores">
    <h3>Operadores</h3>
    <josanz-secondary-button label="Añadir +"></josanz-secondary-button>
  </section>
</div>
