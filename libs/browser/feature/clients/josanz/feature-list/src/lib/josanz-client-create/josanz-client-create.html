<josanz-main-detail-layout 
  title="Nuevo Cliente" 
  [tabs]="tabs" 
  [activeTab]="activeTab()" 
  (tabChange)="setTab($event)"
  (back)="onBack()"
  (save)="onSave()"
  (cancel)="onCancel()"
  saveLabel="Crear cliente"
>
  <!-- Tab: Datos cliente -->
  @if (activeTab() === 'Datos cliente') {
    <div style="display:grid; grid-template-columns:1fr; gap:20px; width:100%; max-width: 800px; padding-top: 24px;">
      <josanz-input
        label="Nombre Apellidos / Razón social"
        placeholder="Empresa Ejemplo"
        controlName="razonSocial"
        [parentForm]="form">
      </josanz-input>
      <josanz-input
        label="Email"
        placeholder="email@email.com"
        type="email"
        controlName="email"
        [parentForm]="form">
      </josanz-input>
      <josanz-input
        label="Teléfono"
        placeholder="+34 600 000 000"
        type="tel"
        controlName="telefono"
        [parentForm]="form">
      </josanz-input>
    </div>
  }

  <!-- Tab: Operadores (placeholder) -->
  @if (activeTab() === 'Operadores') {
    <div style="padding:40px 0; text-align:center; color:#A0AEC0; font-size:14px;">
      Guarde el cliente primero para asignar operadores
    </div>
  }

  <!-- Tab: Eventos (placeholder) -->
  @if (activeTab() === 'Eventos') {
    <div style="padding:40px 0; text-align:center; color:#A0AEC0; font-size:14px;">
      Guarde el cliente primero para registrar eventos
    </div>
  }

</josanz-main-detail-layout>
