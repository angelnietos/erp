<josanz-modal title="Cliente" (close)="onCancel()">

  <!-- Tabs: Datos cliente / Operadores / Eventos -->
  <div style="display:flex; gap:8px; margin-bottom:32px;">
    <button
      (click)="setTab('datos')"
      [style.font-weight]="activeTab() === 'datos' ? '600' : '400'"
      [style.border]="activeTab() === 'datos' ? '1.5px solid #1A1A1A' : '1.5px solid #E2E8F0'"
      [style.color]="activeTab() === 'datos' ? '#1A1A1A' : '#A0AEC0'"
      style="padding: 6px 16px; border-radius: 20px; background: white; cursor: pointer; font-size: 14px; transition: all 0.15s;"
    >Datos cliente</button>
    <button
      (click)="setTab('operadores')"
      [style.font-weight]="activeTab() === 'operadores' ? '600' : '400'"
      [style.border]="activeTab() === 'operadores' ? '1.5px solid #1A1A1A' : '1.5px solid #E2E8F0'"
      [style.color]="activeTab() === 'operadores' ? '#1A1A1A' : '#A0AEC0'"
      style="padding: 6px 16px; border-radius: 20px; background: white; cursor: pointer; font-size: 14px; transition: all 0.15s;"
    >Operadores</button>
    <button
      (click)="setTab('eventos')"
      [style.font-weight]="activeTab() === 'eventos' ? '600' : '400'"
      [style.border]="activeTab() === 'eventos' ? '1.5px solid #1A1A1A' : '1.5px solid #E2E8F0'"
      [style.color]="activeTab() === 'eventos' ? '#1A1A1A' : '#A0AEC0'"
      style="padding: 6px 16px; border-radius: 20px; background: white; cursor: pointer; font-size: 14px; transition: all 0.15s;"
    >Eventos</button>
  </div>

  <!-- Tab: Datos cliente -->
  @if (activeTab() === 'datos') {
    <div style="display:grid; grid-template-columns:1fr; gap:20px; width:100%;">
      <josanz-input
        label="Nombre Apellidos / Razón social"
        placeholder="Empresa Ejemplo"
        controlName="razonSocial"
        [parentForm]="form">
      </josanz-input>
      <josanz-input
        label="Email"
        placeholder="email@email.com"
        type="email"
        controlName="email"
        [parentForm]="form">
      </josanz-input>
      <josanz-input
        label="Teléfono"
        placeholder="+34 600 000 000"
        type="tel"
        controlName="telefono"
        [parentForm]="form">
      </josanz-input>
    </div>
  }

  <!-- Tab: Operadores (placeholder) -->
  @if (activeTab() === 'operadores') {
    <div style="padding:40px 0; text-align:center; color:#A0AEC0; font-size:14px;">
      Sin operadores asignados
    </div>
  }

  <!-- Tab: Eventos (placeholder) -->
  @if (activeTab() === 'eventos') {
    <div style="padding:40px 0; text-align:center; color:#A0AEC0; font-size:14px;">
      Sin eventos registrados
    </div>
  }

  <!-- Footer -->
  <div footer-actions style="display:flex; align-items:center; justify-content:center; gap:32px; width:100%;">
    <josanz-button
      label="Cancelar"
      variant="secondary"
      size="lg"
      [showIcon]="false"
      (btnClick)="onCancel()">
    </josanz-button>
    <josanz-button
      label="Guardar cambios"
      size="lg"
      [showIcon]="false"
      (btnClick)="onSave()"
      [disabled]="form.invalid">
    </josanz-button>
  </div>

</josanz-modal>
