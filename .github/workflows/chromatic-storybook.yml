name: Storybook Visual Regression (Chromatic)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: chromatic-storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Publish josanz-ui Storybook
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build josanz-ui Storybook
        run: pnpm exec nx run josanz-ui:build-storybook:ci

      - name: Chromatic disabled
        run: |
          echo "::notice::Chromatic is disabled for automatic deploys. Add CHROMATIC_PROJECT_TOKEN and re-enable push triggers when visual regression is needed."
