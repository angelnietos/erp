name: Storybook Visual Regression (Chromatic)

on:
  push:
    branches:
      - storybook-deploy
      - storybook_deploy
  pull_request:
    branches:
      - storybook-deploy
      - storybook_deploy
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: chromatic-storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Publish josanz-ui Storybook
    runs-on: ubuntu-latest
    env:
      CI: true
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate Chromatic token
        id: chromatic_config
        continue-on-error: true
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::warning::Chromatic was skipped because CHROMATIC_PROJECT_TOKEN is not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.chromatic_config.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build josanz-ui Storybook
        if: steps.chromatic_config.outputs.configured == 'true'
        run: pnpm exec nx run josanz-ui:build-storybook:ci

      - name: Publish to Chromatic
        if: steps.chromatic_config.outputs.configured == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec chromatic \
            --storybook-build-dir dist/storybook/josanz-ui \
            --only-changed \
            --exit-zero-on-changes
