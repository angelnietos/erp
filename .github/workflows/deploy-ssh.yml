name: Deploy — SSH (Ubuntu)

# Tras publicar imágenes en GHCR, o manualmente cuando el servidor tiene deploy/.env
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno a desplegar'
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      ref:
        description: 'Rama o tag desplegado (informativo)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
      DEPLOY_ENV_FILE: deploy/.env.${{ inputs.environment }}
    steps:
      - name: Validate deploy secrets
        run: |
          missing=""
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!key}" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Faltan secretos:$missing"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"
            ENV_FILE="${{ env.DEPLOY_ENV_FILE }}"
            if [ ! -f "$ENV_FILE" ]; then
              ENV_FILE="deploy/.env"
            fi
            if [ ! -f "$ENV_FILE" ]; then
              echo "No existe $ENV_FILE ni deploy/.env"
              exit 1
            fi
            if [ -n "${{ env.GHCR_PULL_TOKEN }}" ]; then
              echo "${{ env.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ env.GHCR_PULL_USER }}" --password-stdin
            fi
            set -a
            . "$ENV_FILE"
            set +a
            export COMPOSE_PROFILES="${COMPOSE_PROFILES:-josanz,core}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
