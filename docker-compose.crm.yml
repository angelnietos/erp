# Postgres dedicado al CRM Verifactu (`generic_crm`). Puerto host 55432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: generic-crm-postgres
    restart: unless-stopped
    ports:
      - '55432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: generic_crm
    volumes:
      - generic_crm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d generic_crm']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  generic_crm_pg:
